<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V11.1 · Motor Semántico Unificado de Automotores · Pre-BETA</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><main><h1>Auditor de Automotores V11.1 · Pre-BETA</h1><p class="lead">Motor semántico unificado · universo → objetos/roles → eventos → identidad → cronología → árbitro único.</p><section class="card controls"><input id="file" type="file" accept=".xlsx,.xls"><button id="f1" disabled>1️⃣ Detectar</button><button id="f2" disabled>2️⃣ Auditar V11</button><button id="f3" disabled>3️⃣ Excel final</button><button id="f4" disabled>4️⃣ Completar datos</button></section><div id="status">Cargá un Excel crudo de Cassandra.</div><section id="summary" class="summary"></section><section class="card downloads"><button id="d1" disabled>⬇ Filtro 1</button><button id="d2" disabled>⬇ Filtro 2</button><button id="d3" disabled>⬇ Excel final</button><button id="d4" disabled>⬇ Final completado</button></section><section class="card"><table><thead><tr><th>Estado</th><th>N° interno</th><th>Carátula</th><th>Motivo</th><th>Relato</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
(function(){
let src=[],cand=[],accepted=[],rejected=[],finalRows=[],completedRows=[],sourceFileName="";
const $=id=>document.getElementById(id), status=$("status");
const norm=s=>(s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const get=(r,names)=>{for(const n of names){const k=Object.keys(r).find(k=>norm(k)===norm(n));if(k)return r[k]}return ""};
const txt=r=>norm(get(r,["relato","descripcion","narrativa","hecho"])), car=r=>norm(get(r,["analisis_caratula","caratula"]));
const RX={
 auto:/\b(AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|FURGON|SEDAN|COCHE|PICK\s?UP)\b/,
 generic:/\b(VEHICULO|RODADO|UNIDAD)\b/,
 moto:/\b(MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR|SCOOTER)\b/,
 bici:/\b(BICICLETA|BICI)\b/,
 parte:/\b(RUEDA(?:S)?|NEUMATICO(?:S)?|CUBIERTA(?:S)?|AUXILIO|LLANTA(?:S)?|BATERIA|PATENTE|CHAPA PATENTE|ESTEREO|OPTICA(?:S)?|ESPEJO(?:S)?|FARO(?:S)?|PARAGOLPE|CATALIZADOR|AUTOPARTE(?:S)?)\b/,
 pert:/\b(CELULAR|TELEFONO|IPHONE|MOCHILA|BOLSO|MORRAL|CARTERA|BILLETERA|DOCUMENTACION|DOCUMENTOS|HERRAMIENTA(?:S)?|PERTENENCIA(?:S)?|DINERO|EFECTIVO|MERCADERIA|LLAVE(?:S)?)\b/,
 theft:/\b(SUSTRAE|SUSTRAEN|SUSTRAJO|SUSTRAJERON|SUSTRAIDO|SUSTRAIDA|ROBA|ROBAN|ROBO|ROBARON|ROBADO|ROBADA|APODERA|APODERAN|APODERO|APODERARON|SE LLEVA|SE LLEVAN|SE LLEVO|SE LLEVARON|DESPOJA|DESPOJAN|DESPOJARON)\b/,
 recover:/\b(HALLAN|HALLARON|HALLADO|HALLADA|HALLAZGO|LOCALIZAN|LOCALIZARON|LOCALIZADO|LOCALIZADA|RECUPERAN|RECUPERARON|RECUPERADO|RECUPERADA|ENCUENTRAN|ENCONTRARON|ENCONTRADO|ENCONTRADA|DAN CON|DIERON CON|APARECIO|HABIDO|HABIDA|UBICAN|UBICARON|UBICADO|UBICADA)\b/,
 procedure:/\b(ACTA DE PROCEDIMIENTO|ACTA DE PROCEDI|RECORRIDA|COMANDO DE PATRULLAS|MOVIL POLICIAL|SOMOS COMISIONADOS|ALERTADOS POR 911|OPERADOR DE RADIO|PERSONAL POLICIAL|PROCEDIMIENTO)\b/,
 complaint:/\b(DENUNCIA|DENUNCIANTE|VICTIMA|COMPARECE|SE HACE PRESENTE|MANIFIESTA|REFIERE)\b/,
 later:/\b(POSTERIORMENTE|LUEGO|DESPUES|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A CONTINUACION|SEGUIDAMENTE|MAS TARDE|AL CABO)\b/,
 tracking:/\b(LOJACK|STRIX|GPS|GEOLOCALIZACION|RASTREO|RASTREADOR|POSICIONAMIENTO|SATELITAL)\b/,
 prior:/\b(PEDIDO DE SECUESTRO|POSEE PEDIDO|REGISTRA PEDIDO|PEDIDO ACTIVO|DENUNCIA PREVIA|SUSTRAIDO CON ANTERIORIDAD|HABIA SIDO SUSTRAIDO|HABIA SIDO ROBADO|ANTECEDENTE)\b/,
 offenderMoto:/\b(AUTORES?|SUJETOS?|MASCULINOS?|MALVIVIENTES?|IMPUTADOS?)\b.{0,90}\b(MOTO|MOTOCICLETA|MOTOVEHICULO)\b|\b(MOTO|MOTOCICLETA|MOTOVEHICULO)\b.{0,90}\b(AUTORES?|SUJETOS?|MASCULINOS?|MALVIVIENTES?|IMPUTADOS?)\b/,
 flee:/\b(HUYEN|HUYERON|FUGA|SE DAN A LA FUGA|ESCAPAN|ESCAPARON|RETIRAN|RETIRARON)\b/,
 parked:/\b(ESTACIONADO|ESTACIONADA|APARCADO|APARCADA|DEJO SU|DEJA SU|HABIA DEJADO)\b/,
 absent:/\b(NO SE ENCONTRABA|YA NO ESTABA|NO ESTABA|FALTABA|CONSTATA LA SUSTRACCION|ADVIERTE LA SUSTRACCION)\b/,
 negativeRecovery:/\b(NO FUE HALLADO|NO FUE LOCALIZADO|NO FUE RECUPERADO|SIN RESULTADO|RESULTADO NEGATIVO|NO LOGRAN HALLAR|NO LOGRAN LOCALIZAR|NO SE LOGRO HALLAR|NO SE LOGRO LOCALIZAR)\b/
};
const BRANDS=/\b(FIAT|FORD|RENAULT|PEUGEOT|CHEVROLET|VOLKSWAGEN|VW|TOYOTA|CITROEN|NISSAN|JEEP|MERCEDES(?: BENZ)?|IVECO|HYUNDAI|KIA|SUZUKI|CHERY|AUDI|BMW|DODGE|RAM|HONDA|BAIC)\b/;
const MOTO_BRANDS=/\b(ZANELLA|CORVEN|GILERA|KELLER|MONDIAL|MOTOMEL|CFMOTO|BAJAJ|BENELLI|GUERRERO|YAMAHA|KAWASAKI)\b/;
const sentences=t=>t.split(/[.!?;\n]+/).map(x=>x.trim()).filter(Boolean);
const domainOf=z=>{const m=z.match(/\b(?:DOMINIO|PATENTE|CHAPA PATENTE)?\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{2}\s?\d{3}\s?[A-Z]{2}|[A-Z]{3}\s?\d{3})\b/);return m?m[1].replace(/\s/g,""):""};
const explicitAuto=z=>RX.auto.test(z)||(BRANDS.test(z)&&!MOTO_BRANDS.test(z));
const explicitMoto=z=>RX.moto.test(z)||MOTO_BRANDS.test(z);
const around=(s,re,n=140)=>{const m=re.exec(s);re.lastIndex=0;if(!m)return "";return s.slice(Math.max(0,m.index-n),Math.min(s.length,m.index+m[0].length+n))};
function objectType(z){
 if(RX.bici.test(z))return "BICICLETA";
 if(explicitMoto(z)&&!explicitAuto(z))return "MOTOVEHICULO";
 if(RX.parte.test(z)&&!explicitAuto(z))return "AUTOPARTE";
 if(RX.pert.test(z)&&!explicitAuto(z)&&!RX.generic.test(z))return "PERTENENCIA";
 if(explicitAuto(z))return "AUTOMOTOR";
 if(RX.generic.test(z)&&!explicitMoto(z)&&!RX.bici.test(z))return "AUTOMOTOR_GENERICO";
 return "INDETERMINADO";
}
function eventObject(sentence,kind){
 const z=sentence;
 const verb=kind==="SUSTRACCION"?RX.theft:RX.recover;
 const w=around(z,verb,180)||z;
 if(RX.bici.test(w))return "BICICLETA";
 if(explicitMoto(w)&&!explicitAuto(w))return "MOTOVEHICULO";
 if(RX.parte.test(w)&&!explicitAuto(w))return "AUTOPARTE";
 if(RX.pert.test(w)&&!explicitAuto(w)&&!RX.generic.test(w))return "PERTENENCIA";
 if(explicitAuto(w))return "AUTOMOTOR";
 if(RX.generic.test(w)&&!explicitMoto(w))return "AUTOMOTOR_GENERICO";
 return objectType(z);
}
function localEvents(t){
 const out=[]; let pos=0;
 for(const s of sentences(t)){
   const theft=RX.theft.test(s), rec=RX.recover.test(s);
   const dom=domainOf(s);
   if(theft)out.push({kind:"SUSTRACCION",type:eventObject(s,"SUSTRACCION"),dom,text:s,pos:pos++});
   if(rec){
     const neg=RX.negativeRecovery.test(s)||/\b(BUSCA|BUSCAR|BUSCANDO|RASTRILLAJE|PARA ENCONTRAR|PARA HALLAR|PARA LOCALIZAR)\b/.test(s);
     if(!neg)out.push({kind:"RECUPERACION",type:eventObject(s,"RECUPERACION"),dom,text:s,pos:pos++});
   }
 }
 return out;
}
function scene(r){
 const t=txt(r),c=car(r),ev=localEvents(t);
 const autoThefts=ev.filter(e=>e.kind==="SUSTRACCION"&&["AUTOMOTOR","AUTOMOTOR_GENERICO"].includes(e.type));
 const autoRecs=ev.filter(e=>e.kind==="RECUPERACION"&&["AUTOMOTOR","AUTOMOTOR_GENERICO"].includes(e.type));
 const nonAutoThefts=ev.filter(e=>e.kind==="SUSTRACCION"&&["MOTOVEHICULO","BICICLETA"].includes(e.type));
 const partThefts=ev.filter(e=>e.kind==="SUSTRACCION"&&["AUTOPARTE","PERTENENCIA"].includes(e.type));
 const offenderMoto=RX.offenderMoto.test(t)||(explicitMoto(t)&&RX.flee.test(t)&&explicitAuto(t));
 const parkedGone=RX.parked.test(t)&&RX.absent.test(t)&&(explicitAuto(t)||RX.generic.test(t));
 const forcedExit=/\b(OBLIGA|OBLIGAN|INTIMA|INTIMAN|HACE DESCENDER|HACEN DESCENDER)\b.{0,220}\b(DESCEND|BAJAR|BAJE|VEHICULO|RODADO|AUTO|CAMIONETA)\b/.test(t);
 const takeVehicle=/\b(SUBEN|SUBIERON|ABORDAN|ABORDARON|TOMAN POSESION|SE APODERAN)\b.{0,160}\b(VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,220}\b(FUGA|HUYEN|RETIRAN|LLEVAN|MARCHA)\b/.test(t);
 const completeAuto=autoThefts.some(e=>e.type==="AUTOMOTOR")||parkedGone||forcedExit||takeVehicle;
 const caratAuto=/SUSTRA[C]?CION AUTOMOTOR|HALLAZGO AUTOMOTOR|AUTOMOTOR/.test(c);
 return {t,c,ev,autoThefts,autoRecs,nonAutoThefts,partThefts,offenderMoto,parkedGone,forcedExit,takeVehicle,completeAuto,caratAuto};
}
function universe(sc){
 const {t,autoThefts,autoRecs,nonAutoThefts,partThefts,offenderMoto,completeAuto,caratAuto}=sc;
 const explicitAutoEvidence=explicitAuto(t)||autoThefts.some(e=>e.type==="AUTOMOTOR")||autoRecs.some(e=>e.type==="AUTOMOTOR")||completeAuto;
 const onlyNonAuto=nonAutoThefts.length>0&&!explicitAutoEvidence&&!offenderMoto;
 const onlyParts=partThefts.length>0&&!completeAuto&&!autoThefts.length&&!autoRecs.length;
 if(onlyNonAuto)return {in:false,principal:nonAutoThefts[0].type,why:"Objeto víctima no automotor."};
 if(onlyParts)return {in:false,principal:partThefts[0].type,why:"Solo pertenencia/autoparte; el automotor es contexto."};
 if(explicitAutoEvidence||caratAuto)return {in:true,principal:"AUTOMOTOR",why:offenderMoto?"Automotor víctima; la moto pertenece a autores/traslado.":"Automotor relevante confirmado."};
 return {in:false,principal:"INDETERMINADO",why:"No se confirma automotor como objeto víctima/relevante."};
}
function identity(sc){
 const {autoThefts,autoRecs,t}=sc;
 for(const a of autoThefts)for(const b of autoRecs)if(a.dom&&b.dom&&a.dom===b.dom)return {level:"ALTA",why:"mismo dominio "+a.dom};
 const domains=[...t.matchAll(/\b(?:[A-Z]{2}\d{3}[A-Z]{2}|[A-Z]{3}\d{3})\b/g)].map(m=>m[0]);
 const repeated=domains.find((d,i)=>domains.indexOf(d)!==i);
 if(repeated&&autoThefts.length&&autoRecs.length)return {level:"ALTA",why:"dominio repetido "+repeated};
 if(autoThefts.length&&autoRecs.length&&/\b(DICHO|MISMO|MISMA|EL RODADO|EL VEHICULO|LA UNIDAD|VEHICULO SUSTRAIDO|RODADO SUSTRAIDO)\b/.test(t))return {level:"MEDIA",why:"correferencia al mismo automotor"};
 if(autoThefts.length&&autoRecs.length&&RX.tracking.test(t))return {level:"MEDIA",why:"rastreo/localización vinculada al automotor"};
 return {level:"BAJA",why:"sin continuidad objetiva suficiente"};
}
function positivePriorLink(sc){
 const {t}=sc;
 const positive=RX.prior.test(t)||/\b(SUSTRAIDO|ROBADO)\b.{0,100}\b(DOMINIO|VEHICULO|RODADO|AUTO|AUTOMOTOR)\b/.test(t)||/\b(DOMINIO|VEHICULO|RODADO|AUTO|AUTOMOTOR)\b.{0,100}\b(PEDIDO DE SECUESTRO|SUSTRAIDO|ROBADO)\b/.test(t);
 const negative=/\b(NO POSEE|NO REGISTRA|SIN)\b.{0,60}\b(PEDIDO DE SECUESTRO|PEDIDO ACTIVO|IMPEDIMENTO)\b/.test(t);
 return positive&&!negative;
}
function chronology(sc){
 const {t,ev}=sc;
 const firstRec=ev.findIndex(e=>e.kind==="RECUPERACION"&&["AUTOMOTOR","AUTOMOTOR_GENERICO"].includes(e.type));
 const firstTheft=ev.findIndex(e=>e.kind==="SUSTRACCION"&&["AUTOMOTOR","AUTOMOTOR_GENERICO"].includes(e.type));
 const procedure=RX.procedure.test(t);
 const prior=positivePriorLink(sc);
 const findingFirst=procedure&&firstRec>=0&&(firstTheft<0||firstRec<firstTheft)&&prior;
 const theftThenRecovery=firstTheft>=0&&firstRec>=0&&firstTheft<firstRec;
 const reportTheftThenTracked=sc.completeAuto&&sc.autoRecs.length&&RX.tracking.test(t)&&!findingFirst;
 return {findingFirst,theftThenRecovery:theftThenRecovery||reportTheftThenTracked,prior,procedure};
}
function recoveryStrength(sc){
 const {t,autoRecs}=sc;
 if(!autoRecs.length)return {yes:false,level:"NINGUNA",why:"sin recuperación positiva"};
 if(RX.negativeRecovery.test(t))return {yes:false,level:"NINGUNA",why:"rastreo/hallazgo negativo"};
 if(autoRecs.some(e=>e.dom))return {yes:true,level:"ALTA",why:"recuperación con dominio"};
 if(RX.tracking.test(t)||/\b(HABIDO|RECUPERADO|HALLADO|APARECIO|DIERON CON|DAN CON)\b/.test(t))return {yes:true,level:"ALTA",why:"recuperación/localización afirmativa"};
 return {yes:true,level:"MEDIA",why:"evento de recuperación detectado"};
}
function classify(sc){
 const u=universe(sc),id=identity(sc),ch=chronology(sc),rec=recoveryStrength(sc);
 const evidence=[],contra=[];
 if(sc.completeAuto)evidence.push("sustracción completa");
 if(rec.yes)evidence.push(rec.why);
 if(id.level!=="BAJA")evidence.push(id.why);
 if(ch.prior)evidence.push("antecedente positivo vinculado");
 if(sc.offenderMoto)evidence.push("moto de autores, no objeto víctima");
 if(!u.in)return {ok:0,cond:"DESCARTADO",conf:"ALTA",why:u.why,u,id,ch,rec,evidence,contra};
 if(ch.findingFirst){
   return {ok:1,cond:"HALLAZGO",conf:id.level==="ALTA"?"ALTA":"MEDIA",why:"El hecho actual abre con hallazgo/localización y existe antecedente positivo de sustracción/pedido del automotor.",u,id,ch,rec,evidence,contra};
 }
 if(sc.completeAuto&&rec.yes&&ch.theftThenRecovery){
   if(id.level==="ALTA"||id.level==="MEDIA")return {ok:1,cond:"INMEDIATO",conf:id.level==="ALTA"?"ALTA":"MEDIA",why:"Sustracción completa seguida de recuperación del mismo automotor ("+id.why+").",u,id,ch,rec,evidence,contra};
   contra.push("identidad insuficiente entre sustracción y recuperación");
   return {ok:1,cond:"REVISION HUMANA",conf:"MEDIA",why:"Hay sustracción completa y recuperación, pero falta continuidad suficiente para afirmar que es el mismo automotor.",u,id,ch,rec,evidence,contra};
 }
 if(sc.completeAuto||sc.autoThefts.length){
   return {ok:1,cond:"SUSTRAIDO",conf:sc.completeAuto?"ALTA":"MEDIA",why:"Sustracción del automotor sin recuperación posterior confirmada del mismo vehículo.",u,id,ch,rec,evidence,contra};
 }
 if(rec.yes&&ch.prior){
   return {ok:1,cond:"HALLAZGO",conf:"MEDIA",why:"Hallazgo/localización de automotor con antecedente positivo vinculado.",u,id,ch,rec,evidence,contra};
 }
 if(rec.yes&&!ch.prior){
   contra.push("recuperación/hallazgo sin antecedente positivo suficiente");
   return {ok:1,cond:"REVISION HUMANA",conf:"BAJA",why:"Hay una localización/hallazgo vehicular, pero falta confirmar el vínculo positivo con una sustracción previa.",u,id,ch,rec,evidence,contra};
 }
 if(sc.caratAuto){
   contra.push("carátula vehicular sin evento narrativo concluyente");
   return {ok:1,cond:"REVISION HUMANA",conf:"BAJA",why:"Quirón refiere automotor, pero el relato no permite reconstruir con seguridad sustracción o hallazgo.",u,id,ch,rec,evidence,contra};
 }
 return {ok:0,cond:"DESCARTADO",conf:"BAJA",why:"Sin hecho automotor clasificable.",u,id,ch,rec,evidence,contra};
}
function f1(r){
 const t=txt(r),c=car(r);if(!t)return null;
 const vehicle=explicitAuto(t)||explicitMoto(t)||RX.bici.test(t)||RX.generic.test(t)||/AUTOMOTOR/.test(c);
 const event=RX.theft.test(t)||RX.recover.test(t)||RX.prior.test(t)||/SUSTRA[C]?CION AUTOMOTOR|HALLAZGO AUTOMOTOR/.test(c);
 if(!vehicle||!event)return null;
 return {...r,ETAPA_1:"CANDIDATO",MOTIVO_1:"V11.1 · candidato vehicular; universo, objeto víctima y dirección se resuelven en el motor semántico."};
}
function f2(r){
 const sc=scene(r),d=classify(sc),e1=sc.ev[0]||{},e2=sc.ev[1]||{};
 return {ok:d.ok,cond:d.cond,why:d.why,
 V11_UNIVERSO:d.u.in?"AUTOMOTOR":"FUERA/INDETERMINADO",
 V11_OBJETO_PRINCIPAL:d.u.principal,
 V11_EVENTO_1:e1.kind?(e1.kind+" · "+e1.type+(e1.dom?" · "+e1.dom:"")):"",
 V11_EVENTO_2:e2.kind?(e2.kind+" · "+e2.type+(e2.dom?" · "+e2.dom:"")):"",
 V11_IDENTIDAD:d.id.level+" · "+d.id.why,
 V11_CRONOLOGIA:d.ch.findingFirst?"HALLAZGO ACTUAL → ANTECEDENTE":(d.ch.theftThenRecovery?"SUSTRACCION → RECUPERACION":(sc.completeAuto?"SUSTRACCION":"SIN SECUENCIA COMPLETA")),
 V11_CONFIANZA:d.conf,V11_EVENTOS_DETECTADOS:sc.ev.length,
 V11_EVIDENCIAS:d.evidence.join(" | "),V11_CONTRADICCIONES:d.contra.join(" | "),
 V11_MOTO_AUTORES:sc.offenderMoto?"SI":"NO",V11_ANTECEDENTE_POSITIVO:d.ch.prior?"SI":"NO"};
}
function extract(r){
 const t=txt(r);
 const compact=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 const stop=new Set(["IZADA","ISTA","OLLA","NUMERO","SOBRE","SERIE","MOTOR","CHASIS","DOMINIO","MARCA","MODELO","COLOR","TIPO","VEHICULO","AUTOMOTOR","POSEE","POSEIA","PRESENTA","RESULTA","SIENDO","DICHO","MISMO"]);
 const patenteValida=v=>{const x=compact(v);return /^[A-Z]{3}[0-9]{3}$/.test(x)||/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(x)};
 const idValido=(v,min,max)=>{const x=compact(v);return x.length>=min&&x.length<=max&&!stop.has(x)&&/^[A-Z0-9]+$/.test(x)&&/[0-9]/.test(x)};
 const pick=(arr,validar)=>{for(const re of arr){const m=t.match(re);if(m&&validar(m[1]))return compact(m[1])}return ""};
 const patente=pick([
   /\b(?:DOMINIO|PATENTE|CHAPA PATENTE)\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{2}\s*\d{3}\s*[A-Z]{2})(?=\s|[,;.)]|$)/,
   /\b(?:DOMINIO|PATENTE|CHAPA PATENTE)\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{3}\s*\d{3})(?=\s|[,;.)]|$)/
 ],patenteValida);
 const motor=pick([
   /\b(?:NUMERO\s+DE\s+MOTOR|MOTOR(?:\s+NRO|\s+N°|\s+NUMERO)?)\s*[:\-]?\s*([A-Z0-9][A-Z0-9.\-]{3,24})(?=\s|[,;.)]|$)/
 ],v=>idValido(v,4,25));
 const chasis=pick([
   /\b(?:NUMERO\s+DE\s+CHASIS|CHASIS(?:\s+NRO|\s+N°|\s+NUMERO)?|VIN)\s*[:\-]?\s*([A-Z0-9][A-Z0-9.\-]{5,29})(?=\s|[,;.)]|$)/
 ],v=>idValido(v,6,30));
 return {...r,PATENTE:patente,MOTOR:motor,CHASIS:chasis};
}
function validarSalidaVehicular(r){
 const compact=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 const stop=new Set(["IZADA","ISTA","OLLA","NUMERO","SOBRE","SERIE","MOTOR","CHASIS","DOMINIO","MARCA","MODELO","COLOR","TIPO","VEHICULO","AUTOMOTOR","POSEE","POSEIA","PRESENTA","RESULTA","SIENDO","DICHO","MISMO"]);
 const p=compact(r.PATENTE),m=compact(r.MOTOR),c=compact(r.CHASIS);
 const patente=/^(?:[A-Z]{3}[0-9]{3}|[A-Z]{2}[0-9]{3}[A-Z]{2})$/.test(p)?p:"";
 const id=(x,min,max)=>x.length>=min&&x.length<=max&&!stop.has(x)&&/^[A-Z0-9]+$/.test(x)&&/[0-9]/.test(x);
 return {...r,PATENTE:patente,MOTOR:id(m,4,25)?m:"",CHASIS:id(c,6,30)?c:""};
}
function cleanFinal(r){
 const cols=["delito_id","nro_registro","ipp","fecha_carga","hora_carga","dependencia","fecha_inicio_hecho","hora_inicio_hecho","partido_hecho","localidad_hecho","latitud","longitud","calle","altura","entre","calificaciones","relato"];
 const o={}; cols.forEach(k=>o[k]=r[k]??"");
 o.CONDICION=r.CONDICION_AUDITOR||r.CONDICION||"";
 o.MARCA=r.MARCA||"";
 o.MODELO=r.MODELO||"";
 o.MOTOR=r.MOTOR||"";
 o.CHASIS=r.CHASIS||"";
 o.PATENTE=r.PATENTE||"";
 o.ARCHIVO_ORIGEN=r.ARCHIVO_ORIGEN||sourceFileName||"";
 return o;
}
function tick(){return new Promise(r=>setTimeout(r,0))}
function show(rows,key,msg){status.textContent=msg;const c={};rows.forEach(r=>c[r[key]]=(c[r[key]]||0)+1);$("summary").innerHTML=Object.entries(c).map(([k,v])=>'<div class="pill">'+k+": "+v+"</div>").join("");$("rows").innerHTML=rows.slice(0,500).map(r=>"<tr><td>"+esc(r[key])+"</td><td>"+esc(get(r,["numero_interno","nro_interno","numero interno"]))+"</td><td>"+esc(get(r,["analisis_caratula","caratula"]))+"</td><td>"+esc(r.MOTIVO_2||r.MOTIVO_1||"")+"</td><td class='relato'>"+esc(get(r,["relato","descripcion","narrativa","hecho"]))+"</td></tr>").join("")}
function esc(v){return (v??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function dl(name,sheets){const wb=XLSX.utils.book_new();sheets.forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));XLSX.writeFile(wb,name)}
status.textContent="✅ Aplicación lista. Seleccioná el Excel de Cassandra.";
$("file").addEventListener("change",async function(){const f=this.files[0];if(!f)return;try{status.textContent="Leyendo "+f.name+"…";const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});src=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});sourceFileName=f.name;cand=[];accepted=[];rejected=[];finalRows=[];completedRows=[];$("f1").disabled=!src.length;["f2","f3","f4"].forEach(x=>$(x).disabled=true);["d1","d2","d3","d4"].forEach(x=>$(x).disabled=true);status.textContent="✅ "+src.length.toLocaleString("es-AR")+" denuncias cargadas. Presioná 1️⃣ Detectar candidatos."}catch(e){status.textContent="❌ "+e.message}});
$("f1").addEventListener("click",async()=>{cand=[];$("f1").disabled=true;for(let i=0;i<src.length;i++){const x=f1(src[i]);if(x)cand.push(x);if(i%250===0){status.textContent="🔎 Filtro 1 procesando… "+Math.round(100*i/src.length)+"%";await tick()}}$("f1").disabled=false;$("f2").disabled=!cand.length;$("d1").disabled=!cand.length;show(cand,"ETAPA_1","✅ Filtro 1 terminado: "+cand.length.toLocaleString("es-AR")+" candidatos de "+src.length.toLocaleString("es-AR")+".")});
$("f2").addEventListener("click",async()=>{accepted=[];rejected=[];$("f2").disabled=true;for(let i=0;i<cand.length;i++){const r=cand[i],x=f2(r),z={...r,CONDICION_AUDITOR:x.cond||"DESCARTADO",MOTIVO_2:x.why,V11_UNIVERSO:x.V11_UNIVERSO||"",V11_OBJETO_PRINCIPAL:x.V11_OBJETO_PRINCIPAL||"",V11_EVENTO_1:x.V11_EVENTO_1||"",V11_EVENTO_2:x.V11_EVENTO_2||"",V11_IDENTIDAD:x.V11_IDENTIDAD||"",V11_CRONOLOGIA:x.V11_CRONOLOGIA||"",V11_CONFIANZA:x.V11_CONFIANZA||"",V11_EVENTOS_DETECTADOS:x.V11_EVENTOS_DETECTADOS||0,V11_EVIDENCIAS:x.V11_EVIDENCIAS||"",V11_CONTRADICCIONES:x.V11_CONTRADICCIONES||"",V11_MOTO_AUTORES:x.V11_MOTO_AUTORES||"",V11_ANTECEDENTE_POSITIVO:x.V11_ANTECEDENTE_POSITIVO||""};(x.ok?accepted:rejected).push(z);if(i%150===0){status.textContent="🧠 V11 procesando… "+Math.round(100*i/cand.length)+"%";await tick()}}$("f2").disabled=false;$("f3").disabled=!accepted.length;$("f4").disabled=true;$("d2").disabled=false;show(accepted,"CONDICION_AUDITOR","✅ V11: "+accepted.length.toLocaleString("es-AR")+" aceptados / "+rejected.length.toLocaleString("es-AR")+" descartados.")});
$("f3").addEventListener("click",async()=>{
 status.textContent="📊 Armando Excel final operativo…";await tick();
 finalRows=accepted.map(cleanFinal);
 $("d3").disabled=!finalRows.length;$("f4").disabled=!finalRows.length;
 show(finalRows,"CONDICION","✅ Excel final armado: "+finalRows.length.toLocaleString("es-AR")+" filas · 24 columnas operativas.");
});
$("f4").addEventListener("click",async()=>{
 status.textContent="🧾 Completando datos vehiculares…";await tick();
 completedRows=accepted.map(r=>cleanFinal(validarSalidaVehicular(extract(r))));
 $("d4").disabled=!completedRows.length;
 show(completedRows,"CONDICION","✅ Datos completados: "+completedRows.length.toLocaleString("es-AR")+" casos.");
});
$("d1").onclick=()=>dl("FILTRO_1_CANDIDATOS.xlsx",[["CANDIDATOS",cand]]);
$("d2").onclick=()=>dl("FILTRO_2_AUDITORIA.xlsx",[["ACEPTADOS",accepted],["DESCARTADOS",rejected]]);
$("d3").onclick=()=>dl("EXCEL_FINAL_AUTOMOTORES.xlsx",[["FINAL",finalRows]]);
$("d4").onclick=()=>dl("EXCEL_FINAL_AUTOMOTORES_COMPLETADO.xlsx",[["FINAL",completedRows]]);
})();
</script></body></html>
