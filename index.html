</main><script>
(function(){
"use strict";
let src=[],cand=[],accepted=[],rejected=[],finalRows=[],completedRows=[],sourceFileName="";
const $=id=>document.getElementById(id), status=$("status");
const norm=s=>(s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const get=(r,names)=>{for(const n of names){const k=Object.keys(r).find(k=>norm(k)===norm(n));if(k)return r[k]}return ""};
const txt=r=>norm(get(r,["relato","descripcion","narrativa","hecho"]));
const car=r=>norm(get(r,["analisis_caratula","caratula"]));
const calif=r=>norm(get(r,["calificaciones","calificacion"]));
const near=(t,a,b,d=180)=>{for(const m of t.matchAll(new RegExp(a.source,"g"))){if(b.test(t.slice(Math.max(0,m.index-d),m.index+d)))return true}return false};
const splitSent=t=>t.split(/(?<=[.!?;])\s+|\s+-\s+|\n+/).map(x=>x.trim()).filter(Boolean);

// ---------------------------------------------------------------------------
// 1) VOCABULARIO SEMANTICO UNICO
// ---------------------------------------------------------------------------
const RX={
 autoSpecific:/\b(?:AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|FURGON|SEDAN|COCHE)\b/,
 autoGeneric:/\b(?:VEHICULO|RODADO|UNIDAD|AUTOMOTOR)\b/,
 autoAny:/\b(?:AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|FURGON|SEDAN|COCHE|VEHICULO|RODADO|UNIDAD|AUTOMOTOR)\b/,
 moto:/\b(?:MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR|SCOOTER)\b/,
 bici:/\b(?:BICICLETA|BICI)\b/,
 part:/\b(?:RUEDA(?:S)?|CUBIERTA(?:S)?|NEUMATICO(?:S)?|AUXILIO|RUEDA DE AUXILIO|BATERIA|ESTEREO|PATENTE|CHAPA PATENTE|LLANTA(?:S)?|OPTICA(?:S)?|ESPEJO(?:S)?|FARO(?:S)?|PARAGOLPE|CATALIZADOR|AUTOPARTE(?:S)?)\b/,
 belonging:/\b(?:PERTENENCIA(?:S)?|MORRAL|BOLSO|MOCHILA|CARTERA|BILLETERA|CELULAR|TELEFONO|IPHONE|HERRAMIENTA(?:S)?|DOCUMENTACION|DOCUMENTOS|DINERO|EFECTIVO|MERCADERIA|LLAVE|LLAVES)\b/,
 theft:/\b(?:SUSTRAE|SUSTRAEN|SUSTRAJO|SUSTRAJERON|SUSTRAIDO|SUSTRAIDA|ROBA|ROBAN|ROBO|ROBARON|ROBADO|ROBADA|APODERA|APODERAN|APODERO|APODERARON|SE LLEVA|SE LLEVAN|SE LLEVO|SE LLEVARON|DESPOJA|DESPOJAN|DESPOJARON)\b/,
 recovery:/\b(?:HALLA|HALLAN|HALLARON|HALLADO|HALLADA|LOCALIZA|LOCALIZAN|LOCALIZARON|LOCALIZADO|LOCALIZADA|RECUPERA|RECUPERAN|RECUPERARON|RECUPERADO|RECUPERADA|ENCUENTRA|ENCUENTRAN|ENCONTRARON|ENCONTRADO|ENCONTRADA|HABIDO|HABIDA|APARECIO|APARECIDO)\b/,
 procedure:/\b(?:ACTA DE PROCEDI|ACTA DE PROCEDIMIENTO|RECORRIDA|COMANDO DE PATRULLAS|MOVIL POLICIAL|SOMOS COMISIONAD|COMISIONAD|ALERTADOS POR 911|OPERADOR DE RADIO|MODULACION RADIAL|SE CONSTITUYEN|ARRIBAN|ARRIBO|CONCURREN)\b/,
 complaint:/\b(?:DENUNCIA|DENUNCIANTE|RADICANDO|FORMULANDO|RECEPCIONANDO|DEJA ESTACIONADO|DEJO ESTACIONADO|CONSTATA QUE NO)\b/,
 prior:/\b(?:PEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO(?: ACTIVO)?|HABIA SIDO SUSTRAID|HABRIA SIDO SUSTRAID|REGISTRABA.{0,100}SUSTRAID|POSEIA.{0,100}PEDIDO|DENUNCIA PREVIA|DIA DE AYER|EN EL DIA DE AYER)\b/,
 newSeizure:/\b(?:SE DISPONE|DISPONE|SE SOLICITA|SOLICITA|SE IMPARTE|IMPARTE|SE CURSA|CURSA|SE INSERTA|INSERTA)\b.{0,130}\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO\b/,
 tracking:/\b(?:LOJACK|GPS|GEOLOCALIZACION|RASTREO SATELITAL|UBICACION SATELITAL|STRIX|WISETRACK)\b/,
 later:/\b(?:POSTERIORMENTE|LUEGO|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A LOS POCOS MINUTOS|MAS TARDE|ACTO SEGUIDO|DURANTE LA DENUNCIA|MIENTRAS RADICABA|MIENTRAS FORMULABA)\b/,
 coref:/\b(?:DICHO|MISMO|MENCIONADO|REFERIDO|SU|EL) (?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/
};

// ---------------------------------------------------------------------------
// 2) IDENTIDAD VEHICULAR
// ---------------------------------------------------------------------------
function vehicleAttrs(z){
 const dm=z.match(/\b(?:DOMINIO|PATENTE|CHAPA(?: PATENTE)?)\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{2}\s?\d{3}\s?[A-Z]{2}|[A-Z]{3}\s?\d{3})\b/);
 const dominio=dm?dm[1].replace(/\s/g,""):"";
 const marca=(z.match(/\b(?:MARCA|AUTOMOVIL|AUTO|CAMIONETA|VEHICULO|RODADO)\s+([A-Z][A-Z0-9-]{2,15})\b/)||[])[1]||"";
 return {dominio,marca};
}
function sameVehicle(a,b){
 if(a.dominio&&b.dominio)return a.dominio===b.dominio;
 if(a.marca&&b.marca&&a.marca===b.marca)return true;
 return false;
}

// ---------------------------------------------------------------------------
// 3) OBJETO Y ROL: la palabra VEHICULO no decide por si sola
// ---------------------------------------------------------------------------
function objectCandidates(z){
 const out=[]; const push=(type,rx,score)=>{for(const m of z.matchAll(new RegExp(rx.source,"g")))out.push({type,pos:m.index,score})};
 // El tipo específico vale más que el hiperónimo genérico, pero todavía no decide: decide el rol respecto de la acción.
 push("BICICLETA",RX.bici,125); push("MOTOVEHICULO",RX.moto,120); push("AUTOPARTE",RX.part,108); push("PERTENENCIA",RX.belonging,100); push("AUTOMOTOR",RX.autoSpecific,118); push("AUTOMOTOR",RX.autoGeneric,62);
 return out;
}
function clauseAround(z,verbIndex){
 const left=z.slice(0,verbIndex), right=z.slice(verbIndex);
 const lm=Math.max(left.lastIndexOf(","),left.lastIndexOf(";"),left.lastIndexOf(":"));
 let a=lm>=0?lm+1:Math.max(0,verbIndex-170);
 const rm=right.search(/[,;:]/);
 let b=rm>=0?verbIndex+rm:Math.min(z.length,verbIndex+230);
 // Conectores fuertes suelen abrir otro evento/actor; no dejamos que el objeto de esa segunda acción contamine la primera.
 const tail=z.slice(verbIndex,b);
 const cut=tail.search(/\b(?:POSTERIORMENTE|LUEGO|DESPUES|MIENTRAS|QUIEN(?:ES)?|MOMENTO EN QUE|POR LO QUE|ACTO SEGUIDO)\b/);
 if(cut>20)b=verbIndex+cut;
 return {text:z.slice(a,b),start:a,verb:verbIndex-a};
}
function offenderMeansMoto(z){
 return /\b(?:AUTORES?|SUJETOS?|MASCULINOS?|DELINCUENTES?|IMPUTADOS?)\b[^.;]{0,180}\b(?:A BORDO DE|SE MOVILIZABAN EN|CIRCULABAN EN|ARRIBARON EN|LLEGARON EN|HUYERON EN|ESCAPARON EN|SE DIERON A LA FUGA EN|EN|MEDIANTE|UTILIZANDO)\s*(?:UNA? )?(?:MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR)\b/.test(z)
 ||/\b(?:A BORDO DE|SE MOVILIZABAN EN|CIRCULABAN EN|ARRIBARON EN|LLEGARON EN|HUYERON EN|ESCAPARON EN|SE DIERON A LA FUGA EN)\s*(?:UNA? )?(?:MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR)\b/.test(z);
}
function contextualBelonging(z){
 // El automotor es continente/escenario; la acción cae sobre pertenencias o autopartes.
 return /\b(?:DEL|DE SU|DE UN|DE UNA|EN EL|EN SU|DEL INTERIOR DEL|DEL INTERIOR DE SU)\s+(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(z)
   ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,70}\b(?:CONTENIA|CONTENIENDO|EN CUYO INTERIOR|EN SU INTERIOR|DENTRO DEL CUAL)\b/.test(z);
}
function chooseObject(z,verbIndex){
 const cl=clauseAround(z,verbIndex), local=cl.text;
 const after=local.slice(cl.verb,Math.min(local.length,cl.verb+210));
 const before=local.slice(Math.max(0,cl.verb-120),cl.verb+70);
 const meansMoto=offenderMeansMoto(local)||offenderMeansMoto(z);

 // 1. Relaciones explícitas acción→objeto. El objeto específico manda sobre VEHICULO/RODADO genérico.
 const directBike=/\b(?:BICICLETA|BICI)\b/.test(after);
 const directMoto=/\b(?:MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR|SCOOTER)\b/.test(after);
 const directPart=RX.part.test(after);
 const directBel=RX.belonging.test(after);
 const directCar=RX.autoSpecific.test(after)||RX.autoGeneric.test(after);

 // "sustrae X del interior del vehículo": X es el objeto; el vehículo es contexto.
 if((directBel||directPart)&&contextualBelonging(after)){
   const pBel=after.search(RX.belonging), pPart=after.search(RX.part);
   if(pPart>=0&&(pBel<0||pPart<pBel))return "AUTOPARTE";
   return "PERTENENCIA";
 }
 // Posesión explícita: llaves/pertenencias DEL vehículo no convierte al vehículo en objeto sustraído.
 if(/\b(?:LLAVE|LLAVES|PERTENENCIAS|BOLSO|MOCHILA|CELULAR|DOCUMENTACION|DINERO|BILLETERA)\b.{0,75}\b(?:DEL|DE SU) (?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(local))return "PERTENENCIA";
 if(directBike&&!RX.autoSpecific.test(after))return "BICICLETA";
 if(directMoto&&!RX.autoSpecific.test(after)&&!meansMoto)return "MOTOVEHICULO";

 // 2. Puntuación local. Penalizamos contenido, medio de autores y objetos subordinados.
 let c=objectCandidates(after).map(x=>({...x,score:x.score-Math.min(50,x.pos*.28)}));
 if(!c.length)c=objectCandidates(before).map(x=>({...x,score:x.score-28}));
 c=c.map(x=>{
   let score=x.score;
   const pre=after.slice(Math.max(0,x.pos-55),x.pos);
   if(/\b(?:CONTENIENDO|CONTIENE|CONTENIA|EN SU INTERIOR|EN EL INTERIOR|DENTRO DE|JUNTO CON|CARGADO CON)\b/.test(pre))score-=38;
   if(/\b(?:FALTANTE DE|FALTANDO|NO POSEIA|NO TENIA|SIN)\b/.test(pre))score-=32;
   if(x.type==="MOTOVEHICULO"&&meansMoto)score-=120;
   return {...x,score};
 });
 c.sort((a,b)=>b.score-a.score||a.pos-b.pos);
 const best=c[0];
 if(best&&best.score>25)return best.type;

 // 3. Fallback controlado: sólo contexto inequívoco, nunca una palabra genérica aislada.
 if(RX.bici.test(local))return "BICICLETA";
 if(RX.moto.test(local)&&!meansMoto)return "MOTOVEHICULO";
 if(RX.autoSpecific.test(local))return "AUTOMOTOR";
 return "INDETERMINADO";
}
function wholeVehicleTheftPattern(t){
 return /\b(?:SUSTRAE|SUSTRAEN|SUSTRAJO|SUSTRAJERON|ROBA|ROBAN|ROBO|ROBARON|APODERA|APODERAN|APODERO|APODERARON|SE LLEVA|SE LLEVAN|SE LLEVO|SE LLEVARON)\b[^.!?]{0,170}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD)\b/.test(t)
 ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD)\b[^.!?]{0,170}\b(?:SUSTRAID[OA]|ROBADO|ROBADA|SE LO LLEVARON|SE LA LLEVARON)\b/.test(t)
 ||/\b(?:DESPOJA|DESPOJAN|DESPOJARON)\b[^.!?]{0,180}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t)
 ||/\b(?:OBLIGA|OBLIGAN|INTIMA|INTIMAN)\b.{0,180}\bDESCEND(?:ER|ER DEL|A|E)\b.{0,300}\b(?:SE RETIRA|SE RETIRAN|HUYE|HUYEN|FUGA)\b.{0,180}\b(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b/.test(t)
 ||/\b(?:DEJO|DEJA|HABIA DEJADO)\b.{0,120}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,500}\b(?:NO SE ENCONTRABA|YA NO ESTABA|NO ESTABA|HABIA DESAPARECIDO)\b/.test(t);
}

// ---------------------------------------------------------------------------
// 4) EVENTOS: detectamos hechos; todavia no clasificamos
// ---------------------------------------------------------------------------
function buildEvents(t){
 const sents=splitSent(t), events=[];
 for(let i=0;i<sents.length;i++){
   const z=sents[i];
   for(const m of z.matchAll(new RegExp(RX.theft.source,"g"))){
     events.push({idx:i,pos:m.index,type:"SUSTRACCION",obj:chooseObject(z,m.index),text:z,attrs:vehicleAttrs(z),polarity:"AFIRMADA"});
   }
   for(const m of z.matchAll(new RegExp(RX.recovery.source,"g"))){
     const neg=/\b(?:NO|SIN)\b.{0,55}\b(?:HALLAD|LOCALIZAD|RECUPERAD|ENCONTRAD)|\b(?:SE PROCURA|SE INTENTA|A FIN DE|PARA LOGRAR|BUSQUEDA|RASTREO NEGATIVO)\b/.test(z);
     const hyp=/\b(?:PODRIA|HABRIA|POSIBLEMENTE|PRESUNTAMENTE|TAL VEZ)\b.{0,100}\b(?:ENCONTR|HALL|LOCALIZ|RECUPER)/.test(z);
     events.push({idx:i,pos:m.index,type:"RECUPERACION",obj:chooseObject(z,m.index),text:z,attrs:vehicleAttrs(z),polarity:neg?"NEGADA":hyp?"HIPOTETICA":"AFIRMADA"});
   }
 }
 return events;
}

// ---------------------------------------------------------------------------
// 5) MEMORIA NARRATIVA V9.10 REESCRITA: señales fuertes
// ---------------------------------------------------------------------------
function narrativeEvidence(t){
 const V=RX.autoAny,S=RX.theft;
 const theftStrong=near(t,V,S,300)||near(t,S,V,300)||wholeVehicleTheftPattern(t)
  ||/\b(?:TOMAN|TOMARON|SUSTRAEN|SUSTRAJERON) (?:LA |LAS )?LLAVE(?:S)?\b.{0,260}\b(?:SE DAN|DANDOSE|DARSE) A LA FUGA\b/.test(t)
  ||/\b(?:SUBEN|SUBIERON|ABORDAN|ABORDARON) (?:A |AL )?(?:SU |EL )?(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,220}\b(?:FUGA|RETIRAN|HUYEN)\b/.test(t);
 const recoveryStrong=/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b.{0,220}\b(?:FUE|ES|RESULTA|SIENDO)? ?(?:HALLADO|HALLADA|LOCALIZADO|LOCALIZADA|RECUPERADO|RECUPERADA|ENCONTRADO|ENCONTRADA|HABIDO|HABIDA)\b/.test(t)
  ||/\b(?:HALLAN|HALLA|LOCALIZAN|LOCALIZA|RECUPERAN|RECUPERA|ENCONTRARON)\b.{0,220}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b/.test(t)
  ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b.{0,180}\bABANDONAD[OA]\b/.test(t)
  ||/\bABANDONAD[OA]\b.{0,180}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b/.test(t);
 const trackingNeg=/\b(?:NO POSEE|NO TIENE|NO CUENTA CON|CARECE DE|DESCONOCE SI POSEE|SE ENCONTRABA INACTIVO)\b.{0,80}\b(?:LOJACK|GPS|GEOLOCALIZACION|RASTREO SATELITAL|UBICACION SATELITAL)\b/.test(t)||/\b(?:LOJACK|GPS|GEOLOCALIZACION|RASTREO SATELITAL)\b.{0,80}\b(?:NO|INACTIVO|NEGATIVO)\b/.test(t);
 const trackingOther=/\b(?:ICLOUD|FIND MY|GPS|GEOLOCALIZACION|UBICACION)\b.{0,220}\b(?:CELULAR|TELEFONO|IPHONE|TABLET|NOTEBOOK|MOCHILA|BOLSO)\b/.test(t)||/\b(?:CELULAR|TELEFONO|IPHONE|TABLET|NOTEBOOK|MOCHILA|BOLSO)\b.{0,220}\b(?:ICLOUD|GPS|GEOLOCALIZACION|UBICACION)\b/.test(t);
 const trackingPositive=!trackingNeg&&!trackingOther&&(/\b(?:LOJACK|GPS|GEOLOCALIZACION|RASTREO SATELITAL|UBICACION SATELITAL|STRIX|WISETRACK)\b.{0,300}\b(?:INFORMA|INDICA|APORTA|ARROJA|UBICA|LOCALIZA|CONSTATA|ENCUENTRA)\w*\b/.test(t));
 const duringComplaint=/\b(?:MIENTRAS|AL MOMENTO|EN MOMENTOS QUE).{0,130}\b(?:RADICABA|REALIZABA|FORMULABA|EFECTUABA|DENUNCIA)\b.{0,300}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA]|APARECIDO)\b/.test(t);
 const noticeFound=/\b(?:RECIBE|RECIBIO|TOMA CONOCIMIENTO|LE INFORMAN|LE INFORMARON|INFORMAN|INFORMARON|LE AVISAN|LE AVISARON|AVISO|MODULACION|RADIAL|911)\b.{0,340}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,180}\b(?:HABIA APARECIDO|HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA])\b/.test(t);
 const foundIt=/\b(?:DAN|DIERON|LOGRAN|LOGRARON) (?:FINALMENTE )?CON (?:EL |LA |DICHO |DICHA |SU )?(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);
 const abandonedAfter=/\b(?:SUSTRAEN|SUSTRAJERON|ROBAN|ROBARON|APODERAN|APODERARON|SE LLEVAN|SE LLEVARON|DESPOJAN|DESPOJARON)\b.{0,1100}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,260}\b(?:DEJAN|DEJARON|ABANDONAN|ABANDONARON|QUEDA|QUEDO|FUE)\b.{0,100}\bABANDONAD[OA]\b/.test(t);
 const explicitLater=/\b(?:POSTERIORMENTE|LUEGO|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A LOS POCOS MINUTOS|MAS TARDE)\b.{0,500}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA]|ENCONTRAD[OA]|HALLAN|LOCALIZAN|RECUPERAN|ENCUENTRAN)\b/.test(t);
 const positiveConstata=/\b(?:SE DIRIGE|SE DIRIGIO|ARRIBA|ARRIBO|CONCURRE|CONCURRIO)\b.{0,250}\b(?:AL LUGAR|A LA UBICACION|A DICHA UBICACION)\b.{0,220}\b(?:CONSTATA|OBSERVA|VISUALIZA|RECONOCE)\b.{0,140}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);
 const negativeAbsence=/\b(?:CONSTATA|ADVIERTE|OBSERVA)\b.{0,140}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,120}\b(?:NO SE ENCONTRABA|NO ESTABA|YA NO SE ENCONTRABA|NO SE HALLABA|FALTABA)\b/.test(t);
 const historicalRecoveryBeforeCurrent=/\b(?:DIA|FECHA)\b.{0,90}\b(?:ANTERIOR|PASAD[OA]|[0-3]?[0-9][\/\-][01]?[0-9][\/\-](?:20)?2[0-9])\b.{0,550}\b(?:RECUPER[AO]|HALLAD[OA]|HABID[OA])\b.{0,900}\b(?:EN LA FECHA|DIA DE LA FECHA|HOY)\b.{0,550}\b(?:SUSTRA|ROBA|APODERA)\w*/.test(t);
 return {theftStrong,recoveryStrong,trackingPositive,duringComplaint,noticeFound,foundIt,abandonedAfter,explicitLater,positiveConstata,negativeAbsence,historicalRecoveryBeforeCurrent};
}

// ---------------------------------------------------------------------------
// 6) FICHA UNICA
// ---------------------------------------------------------------------------
function analyze(r){
 const t=txt(r),c=car(r),cf=calif(r),events=buildEvents(t),n=narrativeEvidence(t),sents=splitSent(t);
 const temporalV12=V1123_temporalV12(r,t);
 const procedure=RX.procedure.test(t), complaint=RX.complaint.test(t), prior=RX.prior.test(t), newSeizure=RX.newSeizure.test(t);
 const thefts=events.filter(e=>e.type==="SUSTRACCION"&&e.polarity==="AFIRMADA");
 const recoveries=events.filter(e=>e.type==="RECUPERACION"&&e.polarity==="AFIRMADA");
 let autoThefts=thefts.filter(e=>e.obj==="AUTOMOTOR");
 let autoRecs=recoveries.filter(e=>e.obj==="AUTOMOTOR");
 const explicitWhole=wholeVehicleTheftPattern(t);
 const explicitNonAuto=thefts.filter(e=>/^(MOTOVEHICULO|BICICLETA|AUTOPARTE|PERTENENCIA)$/.test(e.obj));
 const explicitVictimMotoBike=explicitNonAuto.some(e=>/^(MOTOVEHICULO|BICICLETA)$/.test(e.obj));
 const explicitVictimParts=explicitNonAuto.some(e=>/^(AUTOPARTE|PERTENENCIA)$/.test(e.obj));

    const a=cand[0], b=cand.find(x=>x.m.type!==a.m.type);

  if(t){
    const after=M.find(m=>m.type!=='G'&&m.pos>pos&&m.pos-pos<150&&m.pos<right&&!m.medio);
    if(after)return after.type;
  }

}

// ---------------------------------------------------------------- 3) SUSTRACCIONES
const V12_VERB="SUSTRA(?:E|EN|JO|JERON|IA|IAN|ER|ERLE|ERLES|ERLO|ERLA|YENDO|YENDOLE|YENDOLES|IDO|IDA|IDOS|IDAS|JERA|JERAN)|SUSTRACCION|ROB(?:A|AN|O|ARON|ABA|ABAN|AR|ARLE|ARLES|ARLO|ARLA|ANDO|ANDOLE|ADO|ADA|ADOS|ADAS)|HURT(?:A|AN|ARON|AR|ARLE|ANDO|ADO|ADA|ADOS|ADAS)|HURTO|(?:DES)?APODER(?:A|AN|O|ARON|ANDOSE|ARSE|ADO|ADA)|DESPOJ(?:A|AN|O|ARON|ANDOLO|ANDOLA|ADO|ADA)|SE (?:LO |LA |LE |LES )?LLEV(?:A|AN|O|ARON)|LLEV(?:ANDOSE|ARSE|ANDOSELO|ARSELO)";
const V12_OBJ=new RegExp("\\b(?:(?<M>"+V12_W_MOTO+")|(?<B>"+V12_W_BICI+")|(?<A>"+V12_W_AUTO+")|(?<G>"+V12_W_GEN+")|(?<P>"+V12_PARTE+")|(?<X>"+V12_PERT+"))\\b","g");
function V12_firstObj(seg){
  V12_OBJ.lastIndex=0; let m;

    const g=m.groups, k=g.M?"M":g.B?"B":g.A?"A":g.G?"G":g.P?"P":"X";
    const pre=seg.slice(Math.max(0,m.index-34),m.index);
    // vehículo como continente/medio: "del interior del auto", "a bordo de una moto", "en un auto"
    if("MBAG".includes(k)){
      if(/\b(?:INTERIOR DE(?:L)?(?: SU| UN| UNA| LA)?|DENTRO DE(?:L)?(?: SU| UN| UNA| LA)?|DE ADENTRO DE(?:L)?|A BORDO DE(?:L)?(?: UNA?| SU| LA)?|ARRIBA DE(?:L)?|DESDE (?:UNA?|EL|SU)|MEDIANTE (?:UNA?|EL)|(?:CIRCULA\w+|MOVILIZA\w+|TRASLADA\w+|ARRIB\w+|LLEG\w+) EN(?: UNA?| EL| SU)?) ?$/.test(pre))continue;
      if(/\b(?:DE|DEL) ?$/.test(pre)&&/\b(?:LLAVES?|BATERIAS?|RUEDAS?|CUBIERTAS?|INTERIOR|BAUL|GUANTERA|DOCUMENTACION|PUERTAS?|VIDRIOS?|CERRADURA)\b/.test(seg.slice(Math.max(0,m.index-45),m.index)))continue;
    }

}
function V12_lastObj(seg){
  V12_OBJ.lastIndex=0; let m,last=null;
  while((m=V12_OBJ.exec(seg))){const g=m.groups;last={k:g.M?"M":g.B?"B":g.A?"A":g.G?"G":g.P?"P":"X",idx:m.index,txt:m[0]}}

function V12_thefts(t,M,dt){
  const ev=[];

    const before=t.slice(Math.max(0,p-60),p), after0=t.slice(e,e+170);
    if(/ A CABO/.test(t.slice(e,e+9)))continue;                       // "se lleva a cabo"
    if(/\b(?:NO|SIN|NI|NUNCA)\b[^.,]{0,18}$/.test(before))continue;     // negado
    const noun=/^(?:SUSTRACCION|HURTO)$/.test(v)||(v==="ROBO"&&!/\b(?:LE|LES|ME|NOS|SE|QUE|QUIEN|Y)\s*$/.test(before));
    const part=/(?:ID[OA]S?|AD[OA]S?)$/.test(v);
    // corta en fin de oración
    let after=after0; const cut=after.search(/\. [A-Z]/); if(cut>=0)after=after.slice(0,cut);

      if(mm){ if(/AUTOMOTOR/.test(mm[0])){o={k:"G",idx:after.indexOf("AUTOMOTOR"),txt:"AUTOMOTOR"}} else {const f=V12_firstObj(after.slice(0,75)); if(f&&f.idx<mm[0].length+28)o=f} }

    const infin=/(?:AR|ER|ARLE|ERLE|ARLES|ERLES|ARLO|ERLO|ARLA|ERLA|ARSE|ARSELO)$/.test(v);
    const attempt=(infin&&/\b(?:INTENT\w*|INTENCION(?:ES)? DE|PRETEND\w*|QUIS(?:O|IERON)|TRAT(?:O|ARON|ANDO) DE|PARA|A FIN DE|FINES DE|CON EL FIN DE|PROPOSITO DE|AMENAZ\w+ CON)\b(?: LUEGO| ASI| PODER)? ?(?:DESTRABARLO Y |ABRIRLO Y )?$/.test(before)&&!/\bPARA LUEGO ?$/.test(before))
      ||/\b(?:TENTATIVA|INTENTO) DE(?: UN| EL)?\s*$/.test(before)||/^[^.]{0,70}\b(?:EN TENTATIVA|EN GRADO DE TENTATIVA|GRADO DE TENTATIVA)\b/.test(after0)

  }
  // hurto por ausencia: "dejó estacionado su auto ... al regresar no se encontraba"
  for(const m of t.matchAll(/\b(?:DEJ[OA]|DEJARA|HABIA DEJADO|DEJANDO|ESTACION[OA]|ESTACIONARA)\b[^.]{0,160}?\b(?:VEHICULO|RODADO|AUTOMOVIL|AUTO|CAMIONETA|CAMION|UTILITARIO)\b[\s\S]{0,420}?\b(?:(?:YA )?NO SE ENCONTRABA|YA NO ESTABA|NO ESTABA|NO LO ENCONTRO|NO LA ENCONTRO|HABIA DESAPARECIDO|NO SE HALLABA|(?:CONSTAT\w+|NOT\w+|ADVI\w+|OBSERV\w+) (?:LA )?(?:FALTA|AUSENCIA|FALTANTE) DE(?:L)? (?:MISMO|RODADO|VEHICULO|AUTOMOVIL|AUTO|SU ))/g)){
    const vp=m.index+m[0].search(/\b(?:VEHICULO|RODADO|AUTOMOVIL|AUTO|CAMIONETA|CAMION|UTILITARIO)\b/);
    let type=/\b(?:AUTOMOVIL|AUTO|CAMIONETA|CAMION|UTILITARIO)\b/.test(m[0])?"A":V12_typeAt(M,vp,dt,t);
    ev.push({pos:m.index+m[0].length-20,opos:vp,verb:"AUSENCIA",type,obj:"vehículo estacionado que ya no está",attempt:false,absence:true});

    ev.push({pos:m.index,opos:m.index,verb:"FUGA EN VEHICULO",type:V12_typeAt(M,m.index,dt,t)==="M"?"M":"A",obj:"vehículo de la víctima",attempt:false,weak:true});
  }
  return ev;
}

// ---------------------------------------------------------------- 4) ANTECEDENTE (pedido de secuestro / alerta)
const V12_MESES={ENERO:1,FEBRERO:2,MARZO:3,ABRIL:4,MAYO:5,JUNIO:6,JULIO:7,AGOSTO:8,SEPTIEMBRE:9,SETIEMBRE:9,OCTUBRE:10,NOVIEMBRE:11,DICIEMBRE:12};
function V12_mkDate(y,mo,d){y=+String(y).replace(".","");if(y<100)y+=2000;mo=+mo;d=+d;if(!(y>=1990&&y<=2100&&mo>=1&&mo<=12&&d>=1&&d<=31))return null;return new Date(Date.UTC(y,mo-1,d))}
function V12_findDate(seg){
  const c=[];
  for(const m of seg.matchAll(/\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-]((?:20)?\d{2})\b/g))c.push({i:m.index,d:V12_mkDate(m[3],m[2],m[1])});

  const ok=c.filter(x=>x.d&&!/\b(?:NACID[OA]|NACIMIENTO|NAC)\b[^,;]{0,28}$/.test(seg.slice(Math.max(0,x.i-40),x.i))).sort((a,b)=>a.i-b.i);
  const pref=ok.find(x=>/\b(?:FECHA|ALTA|DIA)\b[^,;]{0,22}$/.test(seg.slice(Math.max(0,x.i-30),x.i)));
  return (pref||ok[0]||{}).d||null;
}
function V12_pedidos(t,M,dt){
  const out=[];
  const rx=/\b(?:PEDIDO|ADELANTO|SOLICITUD)(?: DE)?(?: ADELANTO(?: DE)?)? SECUESTRO\b|\bSECUESTRO ACTIVO\b|\bPEDIDO ACTIVO\b|\bPARTE DE ALERTA\b|\bALERTA POR (?:ROBO|HURTO)\b|\bIMPEDIMENTO(?: LEGAL)?\b|\bCAPTURA ACTIVA\b/g;

    const p=m.index,e=p+m[0].length,before=t.slice(Math.max(0,p-75),p),after=t.slice(e,e+330);
    const isImp=/^IMPEDIMENTO/.test(m[0]);
    if(/\b(?:NO|NI|SIN|NEGATIVO|NINGUN|CARECE|CARECIENDO|SI)\b[^.]{0,48}$/.test(before))continue;       // "no posee impedimento", "si recae..."
    if(/^[^.]{0,28}\b(?:ALGUNO|NEGATIV[OA])\b/.test(after))continue;
    if(/^[^.]{0,40}\b(?:SIN EFECTO|DE BAJA|DADO DE BAJA)\b/.test(after))continue;
    const bs=before.slice(before.lastIndexOf(". ")+1);
    const has=/\b(?:POSEE|POSEIA|PESA|PESABA|RECAE|RECAIA|ARROJ\w+|REGISTRA\w*|TIENE|TENIA|PRESENTA|CUENTA CON|INFORMA\w*|RESULTADO)\b/.test(bs)||/^ (?:ACTIVO|VIGENTE)/.test(after)||/ACTIVO|ALERTA/.test(m[0]);
    const isNew=/\b(?:SOLICIT\w+|CURS(?:A|AN|E|O|ARON)|INSERT\w+|IMPART\w+|LIBR\w+|CARG(?:A|AN|O|UE)|GENER\w+|DISPON\w+|DISPUS\w+|ORDEN\w+|DA(?:R|N|NDO)? DE ALTA|ALTA DE(?:L)?|EFECTU\w+|REALIZ\w+|CONFECCION\w+)\b[^.]{0,45}$/.test(bs)&&!/\b(?:POSEE|POSEIA|PESA|RECAE|REGISTRA)/.test(bs);
    if(isNew&&!/^ (?:ACTIVO|VIGENTE)/.test(after)){out.push({pos:p,nuevo:true});continue}
    if(isImp&&!/\b(?:POSEE|POSEIA|RECAE|PESA|REGISTRA\w*|TIENE|PRESENTA|ARROJ\w+)\b/.test(bs))continue;
    if(!has)continue;

    out.push({pos:p,nuevo:false,type:V12_typeAt(M,p,dt),fecha:V12_findDate(after),txt:m[0]});

}

// ---------------------------------------------------------------- 5) HALLAZGOS / RECUPEROS
function V12_founds(t,M,dt){
  const out=[];
  const rx=/\bHALLAZGO\b|\bHALLAD[OA]S?\b|\bHALLANDO\b|\bHABID[OA]\b|\bRECUPER(?:AD[OA]|AN|ARON|ANDO)\b|\bLOCALIZAD[OA]\b|\b(?:ESTADO DE )?ABANDON(?:AD[OA]|O|ANDO|ARON|AN)\b|\b(?:DAN|DIERON|DANDO|DAR) CON (?:EL|LA|DICHO|SU) (?:VEHICULO|RODADO|AUTOMOVIL|AUTO|CAMIONETA|UNIDAD)\b|\bENCONTRAD[OA]\b|\bLO ENCUENTRAN?\b|\bAPARECI(?:O|DO)\b/g;
  for(const m of t.matchAll(rx)){
    const p=m.index, before=t.slice(Math.max(0,p-40),p);
    if(/\b(?:NO|SIN|NI|AUN NO|NEGATIVO)\b[^.]{0,26}$/.test(before))continue;
    if(/\b(?:A FIN DE|PARA|FINES DE|PROCURA\w*|INTENTA\w*)\b[^.]{0,22}$/.test(before))continue;
    const left=Math.max(t.lastIndexOf('.',p),t.lastIndexOf(';',p),t.lastIndexOf('\n',p));
    let rdot=t.indexOf('.',p), rsemi=t.indexOf(';',p), rnl=t.indexOf('\n',p);
    const rights=[rdot,rsemi,rnl].filter(x=>x>=0); const right=rights.length?Math.min(...rights):t.length;
    let candidates=[];
    for(const v of M){
      if(v.medio)continue;
      const d=v.pos<p?p-v.end:v.pos-(p+m[0].length);
      const same=v.pos>left&&v.pos<right;
      if(d<0||d>120||!same)continue;
      let w=d+(v.type==='G'?18:0)+(v.kind==='cuadro'?55:0);
      candidates.push({w,d,v});
    }
    candidates.sort((a,b)=>a.w-b.w);
    if(!candidates.length)continue;
    const near=candidates[0];
    let type=near.v.type==='G'?V12_typeAt(M,near.v.pos,dt,t):near.v.type;
    const rival=candidates.find(x=>x.v.type!=='G'&&x.v.type!==type);
    if(rival && rival.w-near.w<24)type='G';
    out.push({pos:p,opos:near.v.pos,type,txt:m[0],obj:near.v.txt,fuerte:/HALLAZGO|HALLAD|HALLANDO|HABID|ABANDON|RECUPER|DAN CON|DIERON CON/.test(m[0])&&near.d<=70});
  }
  return out;
}


// ---------------------------------------------------------------- 5B) V11.25 - FICHA TEMPORAL V12 + ARBITRO TEMPORAL PARA FILTRO 2
// Usa el nucleo V12 completo: sustracciones + hallazgos + pedidos preexistentes + cercania temporal.
// No usa caratula/Quiron para crear el tipo ni para forzar la condicion.
function V1123_parseRowDate(v){
  if(v instanceof Date && !isNaN(v)) return v;
  const z=norm(v||''); if(!z)return null;
  let m=z.match(/\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-]((?:20)?\d{2})\b/);
  if(m)return V12_mkDate(m[3],m[2],m[1]);
  // ISO / yyyy-mm-dd
  m=z.match(/\b(20\d{2})[\-\/.]([01]?\d)[\-\/.]([0-3]?\d)\b/);
  if(m)return V12_mkDate(m[1],m[2],m[3]);
  return null;
}
function V1123_temporalV12(r,t){
  const M=V12_mentions(t), dt=V12_docType(M);
  const th=V12_thefts(t,M,dt).filter(x=>!x.attempt&&x.type==='A');
  const fo=V12_founds(t,M,dt).filter(x=>x.type==='A');
  const pedidos=V12_pedidos(t,M,dt);
  const pedAuto=pedidos.filter(x=>!x.nuevo&&x.type==='A');
  const pedNuevo=pedidos.filter(x=>x.nuevo);
  const fHecho=V1123_parseRowDate(r.fecha_inicio_hecho||r.FECHA_INICIO_HECHO||r.fecha_hecho||r.FECHA_HECHO);
  const fCarga=V1123_parseRowDate(r.fecha_carga||r.FECHA_CARGA);
  const ref=fHecho||fCarga;
  const DAY=86400000;
  const RX_INM=/\bMOMENTOS (?:ANTES|PREVIOS)\b|\bMINUTOS ANTES\b|\bINSTANTES (?:ANTES|PREVIOS)\b|\b(?:POCAS |UNAS )?HORAS ANTES\b|\bRECIENTEMENTE\b|\bACABA(?:BA)?N? DE\b|\bFECHA DE HOY\b|\bEN EL DIA DE (?:LA FECHA|HOY)\b|\bESCUCHA RADIAL\b|\bALERTA RADIAL\b|\bRASTRILLAJE\b|\bRADICAR (?:LA )?DENUNCIA\w*|\bDURANTE LA DENUNCIA\b|\bMIENTRAS (?:RADICABA|FORMULABA|REALIZABA)\b|\bLOJACK\b|\bRASTREO SATELITAL\b|\bGPS\b/;
  const RX_OLD=/\b(?:DIAS|SEMANAS?|MESES|ANOS) (?:ATRAS|ANTES|PASAD[OA]S?)\b|\bHACE (?:UNOS |UNAS |VARIOS |VARIAS |APROXIMADAMENTE |\w+ )?(?:DIAS|SEMANAS?|MES|MESES|ANOS?)\b|\bLA SEMANA PASADA\b|\bEL MES PASADO\b|\bANO PASADO\b/;
  // V11.24: ventana real de horas/mismo dia. Es evidencia temporal, no una clasificacion por frase.
  const RX_SAME_DAY=/\b(?:MISMO DIA|EN EL DIA DE (?:LA FECHA|HOY)|FECHA DE HOY|HORAS TEMPRANAS|HORAS ANTES|POCAS HORAS ANTES|UNAS HORAS ANTES|DURANTE LA MADRUGADA|EN HORAS DE LA (?:MADRUGADA|MANANA|TARDE|NOCHE))\b/;
  const RX_THEFT_EVENT=/\b(?:SUSTRAID[OA]|SUSTRAJERON|SUSTRAJO|ROBAD[OA]|ROBARON|ROBO|APODERARON|APODERO)\b/;
  const cueNear=(pos,rx,w=230)=>rx.test(t.slice(Math.max(0,pos-w),Math.min(t.length,pos+w)));
  let dias=null, pedFecha=null;
  const p=pedAuto.find(x=>x.fecha)||pedAuto[0]||null;
  if(p&&p.fecha&&ref){
    dias=Math.round((ref-p.fecha)/DAY);
    if(dias<0&&fCarga)dias=Math.round((fCarga-p.fecha)/DAY);
    if(dias<0||dias>9000)dias=null; else pedFecha=p.fecha;
  }
  const th0=th.find(x=>!x.weak)||th[0]||null;
  const fo0=fo.find(x=>x.fuerte)||fo[0]||null;
  const old=!!(th0&&cueNear(th0.pos,RX_OLD));
  const inm=!!((th0&&cueNear(th0.pos,RX_INM))||(fo0&&cueNear(fo0.pos,RX_INM,160)));
  // Puede haber un pedido/alerta reciente aunque el extractor de sustraccion no haya tipado el verbo.
  // Exigimos las tres patas: temporalidad de mismo dia + sustraccion narrativa + hallazgo automotor.
  const sameDayCue=RX_SAME_DAY.test(t);

    } else if(th0&&inm&&!old){decision='INMEDIATO';conf='MEDIA';reason='Pedido/alerta activa y sustraccion relatada como reciente.';}
    else if(sameDayTheft&&!old){decision='INMEDIATO';conf='MEDIA';reason='Pedido/alerta preexistente dentro de una ventana de horas o mismo dia, con sustraccion narrativa y hallazgo actual del automotor.';}
    else {decision='HALLAZGO';conf='MEDIA';reason='Automotor hallado con pedido/alerta preexistente; sin evidencia suficiente de que corresponda a una sustraccion del mismo dia.';}
  }
  // Robo + hallazgo del mismo universo: las marcas temporales deciden solo cuando no compiten.
  else if(th0&&fo0){
    if(old&&!inm){decision='HALLAZGO';conf='MEDIA';reason='La sustraccion se relata como antecedente temporal y el hallazgo es actual.';}
    else if(inm&&!old){decision='INMEDIATO';conf=fo0.fuerte?'ALTA':'MEDIA';reason='Sustraccion y hallazgo en la misma secuencia con marca de inmediatez.';}
    else {decision='AMBIGUO';conf='BAJA';reason='Hay sustraccion y hallazgo, pero V12 no separa con seguridad antecedente de misma secuencia.';}
  }
  return {decision,conf,reason,dias,pedFecha,th:th.length,fo:fo.length,ped:pedAuto.length,pedNuevo:pedNuevo.length,old,inm,sameDayCue,sameDayTheft,
    detalle:[...th.slice(0,2).map(x=>'S→'+x.type+'→'+x.obj),...fo.slice(0,2).map(x=>'H→'+x.type+'→'+x.obj),...pedAuto.slice(0,2).map(x=>'P→'+x.type+(x.fecha?'@'+x.fecha.toISOString().slice(0,10):''))].join(' | ')||'SIN_EVENTOS'};
}


function V12_objectEvent(t){
  const M=V12_mentions(t), dt=V12_docType(M);
  const theft=V12_thefts(t,M,dt), found=V12_founds(t,M,dt);
  const ev=[...theft.map(x=>({...x,source:'SUSTRACCION'})),...found.map(x=>({...x,source:'HALLAZGO'}))];
  const valid=ev.filter(x=>!x.attempt && ['A','M','B','G'].includes(x.type));
  const counts={A:0,M:0,B:0,G:0}; valid.forEach(x=>counts[x.type]++);
  let decision='SIN_EVENTO_TIPADO_V12';
  if(counts.A && !counts.M && !counts.B) decision='AUTOMOTOR_OBJETO_V12';
  else if(!counts.A && counts.M && !counts.B) decision='MOTOVEHICULO_OBJETO_V12';
  else if(!counts.A && !counts.M && counts.B) decision='BICICLETA_OBJETO_V12';
  else if(counts.A && (counts.M||counts.B)) decision='CONFLICTO_MULTIVEHICULO_V12';
  else if(counts.M && counts.B) decision='CONFLICTO_MOTO_BICI_V12';

 return {V11_UNIVERSO:a.universe,V11_OBJETO_PRINCIPAL:a.principal,V11_EVENTOS:ev,V11_IDENTIDAD:a.identity,V11_CRONOLOGIA:a.currentFinding?"HALLAZGO_ACTUAL_CON_ANTECEDENTE":a.sequence?"SUSTRACCION→RECUPERACION":a.autoThefts.length?"SUSTRACCION":"INDETERMINADA",V11_RECUPERACION:a.recoveryPositive?"POSITIVA":"NO_CONFIRMADA",V11_ANTECEDENTE:a.positivePriorLink?"POSITIVO":"NO_ACREDITADO",V11_CONTRADICCIONES:a.contradictions.join(" | "),V11_EVIDENCIAS:[a.n.trackingPositive&&"RASTREO+",a.n.duringComplaint&&"DURANTE_DENUNCIA",a.n.noticeFound&&"AVISO_HALLAZGO",a.n.foundIt&&"DAN_CON",a.n.abandonedAfter&&"ABANDONO_POSTERIOR",a.n.explicitLater&&"TEMPORAL_POSTERIOR",a.n.positiveConstata&&"CONSTATACION+"].filter(Boolean).join(" | "),V11_TEMPORAL_V12:a.temporalV12?.decision||"",V11_TEMPORAL_V12_CONF:a.temporalV12?.conf||"",V11_TEMPORAL_V12_DIAS:a.temporalV12?.dias??"",V11_TEMPORAL_V12_DETALLE:a.temporalV12?.detalle||"",V11_TEMPORAL_V12_MOTIVO:a.temporalV12?.reason||"",V11_TEMPORAL_V12_MISMO_DIA:a.temporalV12?.sameDayCue?"SI":"",V11_TEMPORAL_V12_SUSTRACCION_RECIENTE:a.temporalV12?.sameDayTheft?"SI":"",V11_TEMPORAL_V12_AUTORIDAD:(a.temporalV12?.decision==="HALLAZGO"?"HALLAZGO_TEMPORAL":(a.temporalV12?.decision==="INMEDIATO"&&a.temporalV12?.conf==="ALTA"&&a.temporalV12?.fo>0&&(a.temporalV12?.ped>0||a.temporalV12?.th>0)&&!a.temporalV12?.old)?"INMEDIATO_ALTA":(a.temporalV12?.decision==="INMEDIATO"&&a.temporalV12?.conf==="MEDIA"&&a.temporalV12?.fo>0&&a.temporalV12?.ped>0&&a.temporalV12?.sameDayCue&&a.temporalV12?.sameDayTheft&&!a.temporalV12?.old)?"INMEDIATO_MISMO_DIA":(a.temporalV12?.decision==="INMEDIATO"&&a.temporalV12?.conf==="MEDIA"&&a.temporalV12?.fo>0&&a.temporalV12?.th>0&&a.temporalV12?.inm&&!a.temporalV12?.old)?"INMEDIATO_SECUENCIA":"SIN_AUTORIDAD"),VBETA1_EVENTO:a.beta1?.decision||"",VBETA1_CONF:a.beta1?.conf||"",VBETA1_IDENTIDAD:a.beta1?.identity||"",VBETA1_EVIDENCIAS:a.beta1?.evidence||"",VBETA1_AUTORIDAD:a.beta1?.authority?"SI":"NO",VBETA1_MOTIVO:a.beta1?.reason||""};
}
function tick(){return new Promise(r=>setTimeout(r,0))}
function esc(v){return (v??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function show(rows,key,msg){status.textContent=msg;const c={};rows.forEach(r=>c[r[key]]=(c[r[key]]||0)+1);$("summary").innerHTML=Object.entries(c).map(([k,v])=>'<div class="pill">'+esc(k)+': '+v+'</div>').join("");$("rows").innerHTML=rows.slice(0,500).map(r=>'<tr><td>'+esc(r[key])+'</td><td>'+esc(get(r,["numero_interno","nro_interno","numero interno","delito_id"]))+'</td><td>'+esc(get(r,["analisis_caratula","caratula"]))+'</td><td>'+esc(r.MOTIVO_2||r.MOTIVO_1||"")+'</td><td class="relato">'+esc(get(r,["relato","descripcion","narrativa","hecho"]))+'</td></tr>').join("")}
function dl(name,sheets){const wb=XLSX.utils.book_new();sheets.forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));XLSX.writeFile(wb,name)}
status.textContent="✅ V11.19 Filtro 1 Identificador de Objeto Vehicular lista. Seleccioná el Excel de Cassandra.";
$("file").addEventListener("change",async function(){const f=this.files[0];if(!f)return;try{status.textContent="Leyendo "+f.name+"…";const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});src=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});sourceFileName=f.name;cand=[];accepted=[];rejected=[];finalRows=[];completedRows=[];$("f1").disabled=!src.length;["f2","f3","f4","d1","d2","d3","d4"].forEach(x=>$(x).disabled=true);status.textContent="✅ "+src.length.toLocaleString("es-AR")+" denuncias cargadas."}catch(e){status.textContent="❌ "+e.message}});
$("f1").onclick=async()=>{cand=[];$("f1").disabled=true;for(let i=0;i<src.length;i++){const x=f1(src[i]);if(x)cand.push(x);if(i%250===0){status.textContent="🔎 Filtro 1… "+Math.round(100*i/src.length)+"%";await tick()}}$("f1").disabled=false;$("f2").disabled=!cand.length;$("d1").disabled=!cand.length;show(cand,"ETAPA_1","✅ Filtro 1: "+cand.length.toLocaleString("es-AR")+" candidatos.")};
$("f2").onclick=async()=>{accepted=[];rejected=[];$("f2").disabled=true;for(let i=0;i<cand.length;i++){const r=cand[i],x=f2(r),z={...r,CONDICION_AUDITOR:x.cond||"DESCARTADO",MOTIVO_2:x.why,...diag(x.a)};(x.ok?accepted:rejected).push(z);if(i%150===0){status.textContent="🧠 Filtro 2… "+Math.round(100*i/cand.length)+"%";await tick()}}$("f2").disabled=false;$("f3").disabled=!accepted.length;$("d2").disabled=false;show(accepted,"CONDICION_AUDITOR","✅ Filtro 2: "+accepted.length.toLocaleString("es-AR")+" aceptados / "+rejected.length.toLocaleString("es-AR")+" descartados.")};
$("f3").onclick=async()=>{finalRows=accepted.map(cleanFinal);$("d3").disabled=!finalRows.length;$("f4").disabled=!accepted.length;show(accepted,"CONDICION_AUDITOR","✅ Excel final preparado.")};
$("f4").onclick=async()=>{completedRows=accepted.map(r=>cleanFinal(extract(r)));$("d4").disabled=!completedRows.length;show(accepted,"CONDICION_AUDITOR","✅ Datos vehiculares completados: "+completedRows.length.toLocaleString("es-AR")+" casos.")};
$("d1").onclick=()=>dl("FILTRO_1_CANDIDATOS_V11.19.xlsx",[["CANDIDATOS",cand]]);
$("d2").onclick=()=>dl("FILTRO_2_AUDITORIA_V11.5.xlsx",[["ACEPTADOS",accepted],["DESCARTADOS",rejected]]);
$("d3").onclick=()=>dl("EXCEL_FINAL_AUTOMOTORES_V11.5.xlsx",[["FINAL",finalRows]]);
$("d4").onclick=()=>dl("EXCEL_FINAL_AUTOMOTORES_COMPLETADO_V11.5.xlsx",[["FINAL",completedRows]]);
})();
</script></body></html>
