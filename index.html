<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V11.0 · Motor Semántico Unificado de Automotores</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><main><h1>Auditor de Automotores V11.0</h1><p class="lead">Motor semántico unificado · objeto → eventos → identidad → cronología → decisión única.</p><section class="card controls"><input id="file" type="file" accept=".xlsx,.xls"><button id="f1" disabled>1️⃣ Detectar</button><button id="f2" disabled>2️⃣ Auditar V11</button><button id="f3" disabled>3️⃣ Excel final</button><button id="f4" disabled>4️⃣ Completar datos</button></section><div id="status">Cargá un Excel crudo de Cassandra.</div><section id="summary" class="summary"></section><section class="card downloads"><button id="d1" disabled>⬇ Filtro 1</button><button id="d2" disabled>⬇ Filtro 2</button><button id="d3" disabled>⬇ Excel final</button><button id="d4" disabled>⬇ Final completado</button></section><section class="card"><table><thead><tr><th>Estado</th><th>N° interno</th><th>Carátula</th><th>Motivo</th><th>Relato</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
(function(){
let src=[],cand=[],accepted=[],rejected=[],finalRows=[],completedRows=[],sourceFileName="";
const $=id=>document.getElementById(id), status=$("status");
const norm=s=>(s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const get=(r,names)=>{for(const n of names){const k=Object.keys(r).find(k=>norm(k)===norm(n));if(k)return r[k]}return ""};
const txt=r=>norm(get(r,["relato","descripcion","narrativa","hecho"])), car=r=>norm(get(r,["analisis_caratula","caratula"]));
const RX={
 auto:/\b(AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|FURGON|SEDAN|COCHE)\b/, generic:/\b(VEHICULO|RODADO|UNIDAD)\b/,
 moto:/\b(MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR|SCOOTER)\b/, bici:/\b(BICICLETA|BICI)\b/,
 parte:/\b(RUEDA(?:S)?|NEUMATICO(?:S)?|CUBIERTA(?:S)?|AUXILIO|LLANTA(?:S)?|BATERIA|PATENTE|CHAPA PATENTE|ESTEREO|OPTICA(?:S)?|ESPEJO(?:S)?|FARO(?:S)?|PARAGOLPE|CATALIZADOR|AUTOPARTE(?:S)?)\b/,
 pert:/\b(CELULAR|TELEFONO|IPHONE|MOCHILA|BOLSO|MORRAL|CARTERA|BILLETERA|DOCUMENTACION|DOCUMENTOS|HERRAMIENTA(?:S)?|PERTENENCIA(?:S)?|DINERO|EFECTIVO|MERCADERIA)\b/,
 theft:/\b(SUSTRAE|SUSTRAEN|SUSTRAJO|SUSTRAJERON|SUSTRAIDO|SUSTRAIDA|ROBA|ROBAN|ROBO|ROBARON|ROBADO|ROBADA|APODERA|APODERAN|APODERO|APODERARON|SE LLEVA|SE LLEVAN|SE LLEVO|SE LLEVARON|DESPOJA|DESPOJAN|DESPOJARON)\b/,
 recover:/\b(HALLAN|HALLARON|HALLADO|HALLADA|LOCALIZAN|LOCALIZARON|LOCALIZADO|LOCALIZADA|RECUPERAN|RECUPERARON|RECUPERADO|RECUPERADA|ENCUENTRAN|ENCONTRARON|ENCONTRADO|ENCONTRADA|DAN CON|DIERON CON|APARECIO|HABIDO|HABIDA)\b/,
 procedure:/\b(ACTA DE PROCEDIMIENTO|ACTA DE PROCEDI|RECORRIDA|COMANDO DE PATRULLAS|MOVIL POLICIAL|SOMOS COMISIONADOS|ALERTADOS POR 911|OPERADOR DE RADIO)\b/,
 later:/\b(POSTERIORMENTE|LUEGO|DESPUES|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A CONTINUACION|SEGUIDAMENTE|MIENTRAS|EN EL TRANSCURSO)\b/,
 tracking:/\b(LOJACK|STRIX|GPS|GEOLOCALIZACION|RASTREO|RASTREADOR|POSICIONAMIENTO)\b/
};
const BRANDS=/\b(FIAT|FORD|RENAULT|PEUGEOT|CHEVROLET|VOLKSWAGEN|VW|TOYOTA|CITROEN|NISSAN|JEEP|MERCEDES(?: BENZ)?|IVECO|HYUNDAI|KIA|SUZUKI|CHERY|AUDI|BMW|DODGE|RAM)\b/;
const sentences=t=>t.split(/[.!?;\n]+/).map(x=>x.trim()).filter(Boolean);
const domainOf=z=>{const m=z.match(/\b(?:DOMINIO|PATENTE|CHAPA PATENTE)?\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{2}\s?\d{3}\s?[A-Z]{2}|[A-Z]{3}\s?\d{3})\b/);return m?m[1].replace(/\s/g,""):""};
const explicitAuto=z=>RX.auto.test(z)||BRANDS.test(z);
function objectType(z){if(RX.bici.test(z))return "BICICLETA";if(RX.moto.test(z)&&!explicitAuto(z))return "MOTOVEHICULO";if(RX.parte.test(z)&&!explicitAuto(z))return "AUTOPARTE";if(RX.pert.test(z)&&!explicitAuto(z))return "PERTENENCIA";if(explicitAuto(z)||RX.generic.test(z))return "AUTOMOTOR";return "INDETERMINADO"}
function localEvents(t){const out=[];for(const s of sentences(t)){const theft=RX.theft.test(s), rec=RX.recover.test(s);if(!theft&&!rec)continue;let type=objectType(s);const dom=domainOf(s);const negRec=/\b(NO|SIN)\b.{0,55}\b(ENCONTR|HALL|LOCALIZ|RECUPER)/.test(s)||/\b(BUSCA|BUSCAR|BUSCANDO|RASTRILLAJE|PARA ENCONTRAR|PARA HALLAR|PARA LOCALIZAR)\b/.test(s);if(theft)out.push({kind:"SUSTRACCION",type,dom,text:s});if(rec&&!negRec)out.push({kind:"RECUPERACION",type,dom,text:s});}return out}
function completeAutoTheft(t,ev){
 if(ev.some(e=>e.kind==="SUSTRACCION"&&e.type==="AUTOMOTOR"))return true;
 return /\b(DEJO|DEJA|HABIA DEJADO)\b.{0,120}\b(ESTACIONADO|ESTACIONADA)\b.{0,320}\b(NO SE ENCONTRABA|YA NO ESTABA|NO ESTABA|FALTABA)\b/.test(t)||/\b(SUBEN|SUBIERON|ABORDAN|ABORDARON)\b.{0,100}\b(VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,180}\b(FUGA|HUYEN|RETIRAN|LLEVAN)\b/.test(t)||/\b(OBLIGA|OBLIGAN|INTIMA|INTIMAN)\b.{0,180}\bDESCEND/.test(t)&&/\b(VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b/.test(t);
}
function currentFindingFirst(t,ev){const firstRec=ev.findIndex(e=>e.kind==="RECUPERACION"),firstTheft=ev.findIndex(e=>e.kind==="SUSTRACCION");return RX.procedure.test(t)&&firstRec>=0&&(firstTheft<0||firstRec<firstTheft)}
function identity(thefts,recs,t){for(const a of thefts)for(const b of recs){if(a.dom&&b.dom&&a.dom===b.dom)return {level:"ALTA",why:"mismo dominio "+a.dom};}if(thefts.length&&recs.length&&/\b(DICHO|MISMO|MISMA|EL RODADO|EL VEHICULO|LA UNIDAD|VEHICULO SUSTRAIDO|RODADO SUSTRAIDO)\b/.test(t))return {level:"MEDIA",why:"referencia narrativa al mismo rodado"};if(thefts.length&&recs.length&&RX.tracking.test(t))return {level:"MEDIA",why:"rastreo/localización vinculada al vehículo denunciado"};return {level:"BAJA",why:"sin identidad objetiva suficiente"}}
function f1(r){const t=txt(r),c=car(r);if(!t)return null;const vehicle=explicitAuto(t)||RX.generic.test(t)||/AUTOMOTOR/.test(c);const event=RX.theft.test(t)||RX.recover.test(t)||/SUSTRA[C]?CION AUTOMOTOR|HALLAZGO AUTOMOTOR/.test(c);if(!vehicle||!event)return null;return {...r,ETAPA_1:"CANDIDATO",MOTIVO_1:"V11 · Mención vehicular + evento compatible. La pertenencia al universo se resuelve en auditoría semántica."}}
function f2(r){
 const t=txt(r),c=car(r),ev=localEvents(t);
 const thefts=ev.filter(e=>e.kind==="SUSTRACCION"&&e.type==="AUTOMOTOR"), recs=ev.filter(e=>e.kind==="RECUPERACION"&&e.type==="AUTOMOTOR");
 const nonAutoVictim=ev.some(e=>["MOTOVEHICULO","BICICLETA"].includes(e.type))&&!ev.some(e=>e.type==="AUTOMOTOR");
 const autoComplete=completeAutoTheft(t,ev);
 const autoEvidence=explicitAuto(t)||thefts.length||recs.length||(/AUTOMOTOR/.test(c)&&!nonAutoVictim);
 const partOnly=ev.some(e=>["AUTOPARTE","PERTENENCIA"].includes(e.type))&&!autoComplete&&!thefts.length;
 const id=identity(thefts,recs,t);
 const findingFirst=currentFindingFirst(t,ev);
 let cond="DESCARTADO",ok=0,conf="MEDIA",why="";
 if(nonAutoVictim){why="Fuera del universo: el objeto víctima reconstruido es motovehículo/bicicleta.";}
 else if(partOnly){why="Fuera del universo: la sustracción recae sobre autoparte/pertenencia; el automotor es contexto.";}
 else if(!autoEvidence){why="Sin evidencia suficiente de automotor como objeto relevante.";}
 else if(findingFirst){cond="HALLAZGO";ok=1;conf=recs.length?"ALTA":"MEDIA";why="El hecho actual comienza con localización/hallazgo del automotor; el antecedente de sustracción es previo.";}
 else if(autoComplete&&recs.length){
   if(id.level==="ALTA"||id.level==="MEDIA"){cond="INMEDIATO";ok=1;conf=id.level==="ALTA"?"ALTA":"MEDIA";why="Sustracción completa seguida de recuperación del mismo automotor ("+id.why+").";}
   else {cond="REVISION HUMANA";ok=1;conf="MEDIA";why="Hay sustracción completa y recuperación posterior, pero la identidad del mismo automotor no alcanza confianza suficiente.";}
 }
 else if(autoComplete||thefts.length){cond="SUSTRAIDO";ok=1;conf=autoComplete?"ALTA":"MEDIA";why="Sustracción del automotor completo sin recuperación posterior confirmada del mismo vehículo.";}
 else if(recs.length){cond="HALLAZGO";ok=1;conf="MEDIA";why="Hallazgo/localización actual de automotor sin secuencia actual completa de sustracción→recuperación.";}
 else if(/AUTOMOTOR/.test(c)){cond="REVISION HUMANA";ok=1;conf="BAJA";why="Quirón refiere automotor, pero el relato no permite reconstruir con seguridad sustracción o hallazgo.";}
 const e1=ev[0]||{},e2=ev[1]||{};
 return {ok,cond,why,V11_UNIVERSO:ok?"AUTOMOTOR":"FUERA/INDETERMINADO",V11_OBJETO_PRINCIPAL:autoComplete||thefts.length||recs.length?"AUTOMOTOR":(nonAutoVictim?"NO AUTOMOTOR":"INDETERMINADO"),V11_EVENTO_1:e1.kind?(e1.kind+" · "+e1.type+(e1.dom?" · "+e1.dom:"")):"",V11_EVENTO_2:e2.kind?(e2.kind+" · "+e2.type+(e2.dom?" · "+e2.dom:"")):"",V11_IDENTIDAD:id.level+" · "+id.why,V11_CRONOLOGIA:findingFirst?"HALLAZGO ACTUAL → ANTECEDENTE":(autoComplete&&recs.length?"SUSTRACCION → RECUPERACION":(autoComplete?"SUSTRACCION":"SIN SECUENCIA COMPLETA")),V11_CONFIANZA:conf,V11_EVENTOS_DETECTADOS:ev.length};
}
function extract(r){
 const t=txt(r);
 const compact=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 const stop=new Set(["IZADA","ISTA","OLLA","NUMERO","SOBRE","SERIE","MOTOR","CHASIS","DOMINIO","MARCA","MODELO","COLOR","TIPO","VEHICULO","AUTOMOTOR","POSEE","POSEIA","PRESENTA","RESULTA","SIENDO","DICHO","MISMO"]);
 const patenteValida=v=>{const x=compact(v);return /^[A-Z]{3}[0-9]{3}$/.test(x)||/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(x)};
 const idValido=(v,min,max)=>{const x=compact(v);return x.length>=min&&x.length<=max&&!stop.has(x)&&/^[A-Z0-9]+$/.test(x)&&/[0-9]/.test(x)};
 const pick=(arr,validar)=>{for(const re of arr){const m=t.match(re);if(m&&validar(m[1]))return compact(m[1])}return ""};
 const patente=pick([
   /\b(?:DOMINIO|PATENTE|CHAPA PATENTE)\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{2}\s*\d{3}\s*[A-Z]{2})(?=\s|[,;.)]|$)/,
   /\b(?:DOMINIO|PATENTE|CHAPA PATENTE)\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{3}\s*\d{3})(?=\s|[,;.)]|$)/
 ],patenteValida);
 const motor=pick([
   /\b(?:NUMERO\s+DE\s+MOTOR|MOTOR(?:\s+NRO|\s+N°|\s+NUMERO)?)\s*[:\-]?\s*([A-Z0-9][A-Z0-9.\-]{3,24})(?=\s|[,;.)]|$)/
 ],v=>idValido(v,4,25));
 const chasis=pick([
   /\b(?:NUMERO\s+DE\s+CHASIS|CHASIS(?:\s+NRO|\s+N°|\s+NUMERO)?|VIN)\s*[:\-]?\s*([A-Z0-9][A-Z0-9.\-]{5,29})(?=\s|[,;.)]|$)/
 ],v=>idValido(v,6,30));
 return {...r,PATENTE:patente,MOTOR:motor,CHASIS:chasis};
}
function validarSalidaVehicular(r){
 const compact=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 const stop=new Set(["IZADA","ISTA","OLLA","NUMERO","SOBRE","SERIE","MOTOR","CHASIS","DOMINIO","MARCA","MODELO","COLOR","TIPO","VEHICULO","AUTOMOTOR","POSEE","POSEIA","PRESENTA","RESULTA","SIENDO","DICHO","MISMO"]);
 const p=compact(r.PATENTE),m=compact(r.MOTOR),c=compact(r.CHASIS);
 const patente=/^(?:[A-Z]{3}[0-9]{3}|[A-Z]{2}[0-9]{3}[A-Z]{2})$/.test(p)?p:"";
 const id=(x,min,max)=>x.length>=min&&x.length<=max&&!stop.has(x)&&/^[A-Z0-9]+$/.test(x)&&/[0-9]/.test(x);
 return {...r,PATENTE:patente,MOTOR:id(m,4,25)?m:"",CHASIS:id(c,6,30)?c:""};
}
function cleanFinal(r){
 const cols=["delito_id","nro_registro","ipp","fecha_carga","hora_carga","dependencia","fecha_inicio_hecho","hora_inicio_hecho","partido_hecho","localidad_hecho","latitud","longitud","calle","altura","entre","calificaciones","relato"];
 const o={}; cols.forEach(k=>o[k]=r[k]??"");
 o.CONDICION=r.CONDICION_AUDITOR||r.CONDICION||"";
 o.MARCA=r.MARCA||"";
 o.MODELO=r.MODELO||"";
 o.MOTOR=r.MOTOR||"";
 o.CHASIS=r.CHASIS||"";
 o.PATENTE=r.PATENTE||"";
 o.ARCHIVO_ORIGEN=r.ARCHIVO_ORIGEN||sourceFileName||"";
 return o;
}
function tick(){return new Promise(r=>setTimeout(r,0))}
function show(rows,key,msg){status.textContent=msg;const c={};rows.forEach(r=>c[r[key]]=(c[r[key]]||0)+1);$("summary").innerHTML=Object.entries(c).map(([k,v])=>'<div class="pill">'+k+": "+v+"</div>").join("");$("rows").innerHTML=rows.slice(0,500).map(r=>"<tr><td>"+esc(r[key])+"</td><td>"+esc(get(r,["numero_interno","nro_interno","numero interno"]))+"</td><td>"+esc(get(r,["analisis_caratula","caratula"]))+"</td><td>"+esc(r.MOTIVO_2||r.MOTIVO_1||"")+"</td><td class='relato'>"+esc(get(r,["relato","descripcion","narrativa","hecho"]))+"</td></tr>").join("")}
function esc(v){return (v??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function dl(name,sheets){const wb=XLSX.utils.book_new();sheets.forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));XLSX.writeFile(wb,name)}
status.textContent="✅ Aplicación lista. Seleccioná el Excel de Cassandra.";
$("file").addEventListener("change",async function(){const f=this.files[0];if(!f)return;try{status.textContent="Leyendo "+f.name+"…";const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});src=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});sourceFileName=f.name;cand=[];accepted=[];rejected=[];finalRows=[];completedRows=[];$("f1").disabled=!src.length;["f2","f3","f4"].forEach(x=>$(x).disabled=true);["d1","d2","d3","d4"].forEach(x=>$(x).disabled=true);status.textContent="✅ "+src.length.toLocaleString("es-AR")+" denuncias cargadas. Presioná 1️⃣ Detectar candidatos."}catch(e){status.textContent="❌ "+e.message}});
$("f1").addEventListener("click",async()=>{cand=[];$("f1").disabled=true;for(let i=0;i<src.length;i++){const x=f1(src[i]);if(x)cand.push(x);if(i%250===0){status.textContent="🔎 Filtro 1 procesando… "+Math.round(100*i/src.length)+"%";await tick()}}$("f1").disabled=false;$("f2").disabled=!cand.length;$("d1").disabled=!cand.length;show(cand,"ETAPA_1","✅ Filtro 1 terminado: "+cand.length.toLocaleString("es-AR")+" candidatos de "+src.length.toLocaleString("es-AR")+".")});
$("f2").addEventListener("click",async()=>{accepted=[];rejected=[];$("f2").disabled=true;for(let i=0;i<cand.length;i++){const r=cand[i],x=f2(r),z={...r,CONDICION_AUDITOR:x.cond||"DESCARTADO",MOTIVO_2:x.why,V11_UNIVERSO:x.V11_UNIVERSO||"",V11_OBJETO_PRINCIPAL:x.V11_OBJETO_PRINCIPAL||"",V11_EVENTO_1:x.V11_EVENTO_1||"",V11_EVENTO_2:x.V11_EVENTO_2||"",V11_IDENTIDAD:x.V11_IDENTIDAD||"",V11_CRONOLOGIA:x.V11_CRONOLOGIA||"",V11_CONFIANZA:x.V11_CONFIANZA||"",V11_EVENTOS_DETECTADOS:x.V11_EVENTOS_DETECTADOS||0};(x.ok?accepted:rejected).push(z);if(i%150===0){status.textContent="🧠 V11 procesando… "+Math.round(100*i/cand.length)+"%";await tick()}}$("f2").disabled=false;$("f3").disabled=!accepted.length;$("f4").disabled=true;$("d2").disabled=false;show(accepted,"CONDICION_AUDITOR","✅ V11: "+accepted.length.toLocaleString("es-AR")+" aceptados / "+rejected.length.toLocaleString("es-AR")+" descartados.")});
$("f3").addEventListener("click",async()=>{
 status.textContent="📊 Armando Excel final operativo…";await tick();
 finalRows=accepted.map(cleanFinal);
 $("d3").disabled=!finalRows.length;$("f4").disabled=!finalRows.length;
 show(finalRows,"CONDICION","✅ Excel final armado: "+finalRows.length.toLocaleString("es-AR")+" filas · 24 columnas operativas.");
});
$("f4").addEventListener("click",async()=>{
 status.textContent="🧾 Completando datos vehiculares…";await tick();
 completedRows=accepted.map(r=>cleanFinal(validarSalidaVehicular(extract(r))));
 $("d4").disabled=!completedRows.length;
 show(completedRows,"CONDICION","✅ Datos completados: "+completedRows.length.toLocaleString("es-AR")+" casos.");
});
$("d1").onclick=()=>dl("FILTRO_1_CANDIDATOS.xlsx",[["CANDIDATOS",cand]]);
$("d2").onclick=()=>dl("FILTRO_2_AUDITORIA.xlsx",[["ACEPTADOS",accepted],["DESCARTADOS",rejected]]);
$("d3").onclick=()=>dl("EXCEL_FINAL_AUTOMOTORES.xlsx",[["FINAL",finalRows]]);
$("d4").onclick=()=>dl("EXCEL_FINAL_AUTOMOTORES_COMPLETADO.xlsx",[["FINAL",completedRows]]);
})();
</script></body></html>
