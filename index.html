<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V10.23.5 · V10.23 Auditor de Automotores V10.13 · Arbitraje semántico V9 + V10</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><main><h1>Auditor de Automotores V10.23.5 · Identidad del evento actual</h1><p class="lead">Cassandra → candidatos → auditoría estricta → datos finales.</p><section class="card controls"><input id="file" type="file" accept=".xlsx,.xls"><button id="f1" disabled>1️⃣ Detectar</button><button id="f2" disabled>2️⃣ Auditar</button><button id="f3" disabled>3️⃣ Excel final</button><button id="f4" disabled>4️⃣ Completar datos</button></section><div id="status">Cargá un Excel crudo de Cassandra.</div><section id="summary" class="summary"></section><section class="card downloads"><button id="d1" disabled>⬇ Filtro 1</button><button id="d2" disabled>⬇ Filtro 2</button><button id="d3" disabled>⬇ Excel final</button><button id="d4" disabled>⬇ Final completado</button></section><section class="card"><table><thead><tr><th>Estado</th><th>N° interno</th><th>Carátula</th><th>Motivo</th><th>Relato</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
(function(){
let src=[],cand=[],accepted=[],rejected=[],finalRows=[],completedRows=[],sourceFileName="";
const $=id=>document.getElementById(id), status=$("status");
const norm=s=>(s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const get=(r,names)=>{for(const n of names){const k=Object.keys(r).find(k=>norm(k)===norm(n));if(k)return r[k]}return ""};
const txt=r=>norm(get(r,["relato","descripcion","narrativa","hecho"])), car=r=>norm(get(r,["analisis_caratula","caratula"])), calif=r=>norm(get(r,["calificaciones","calificacion"]));
const V=/\b(AUTOMOVIL|VEHICULO|RODADO|CAMIONETA|CAMION|UTILITARIO|FURGON|SEDAN|COCHE|AUTO)\b/;
const S=/\b(SUSTRA(?:E|EN|JO|JERON|IDO|IDA)|ROBA(?:N|RON|DO|DA)?|APODERA(?:N|RON)?|SE LLEV(?:A|AN|ARON)|NO SE ENCONTRABA|YA NO (?:SE )?ENCONTRABA)\b/;
const R=/\b(HALLA(?:DO|DA|RON|N)?|LOCALIZA(?:DO|DA|RON|N)?|RECUPERA(?:DO|DA|RON|N)?|ABANDONAD[OA]|PEDIDO DE SECUESTRO(?: ACTIVO)?)\b/;
const M=/\b(MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR)\b/;
function near(t,a,b,d=150){for(const m of t.matchAll(new RegExp(a.source,"g"))){if(b.test(t.slice(Math.max(0,m.index-d),m.index+d)))return true}return false}
function f1(r){const t=txt(r),c=car(r);if(!t)return null;const q=/SUSTRA[C]?CION AUTOMOTOR|HALLAZGO AUTOMOTOR/.test(c);if(!(V.test(t)||q)||!(S.test(t)||R.test(t)||q))return null;if(M.test(t)&&!V.test(t)&&!q)return null;return {...r,ETAPA_1:"CANDIDATO",MOTIVO_1:"Automotor + evento compatible. Pasa a auditoría estricta."}}
// V10.3 — LECTOR SEMÁNTICO UNIVERSAL E INDEPENDIENTE.
function construirFichaV10(textoEntrada){
 const t=norm(textoEntrada||"");
 // No usa eventNodes, theftObjectEvidence ni la conclusión de V9 para construir la ficha.
 // V9 sigue decidiendo oficialmente; V10.1 lee el relato desde cero y se evalúa en paralelo.
 const ficha={
   objeto_principal:"INDETERMINADO",tipo_objeto:"INDETERMINADO",rol_objeto:"INDETERMINADO",
   entidad_1:"",entidad_2:"",entidad_3:"",
   relacion_1:"",relacion_2:"",relacion_3:"",
   evento_1:"",evento_2:"",evento_3:"",
   secuencia:"",corresponde_automotor:"INDETERMINADO",
   sustraido_completo:"INDETERMINADO",recuperacion:"INDETERMINADO",
   estado_inferido:"INDETERMINADO",confianza:"BAJA",
   diag_texto_recibido:"",diag_longitud:0,diag_oraciones:0,
   diag_verbos_sustraccion:0,diag_verbos_recuperacion:0,diag_objetos:""
 };

 const v10Sent=t.split(/[.!?;\n]+/).map(x=>x.trim()).filter(Boolean);
 // V10.7 — IDENTIDAD CONCRETA DEL VEHÍCULO.
 // Extrae atributos como evidencia de identidad; no decide por marca/modelo por sí solos.
 const V10_MARCAS=["FIAT","FORD","RENAULT","PEUGEOT","CHEVROLET","VOLKSWAGEN","VW","TOYOTA",
   "CITROEN","CITROËN","NISSAN","HONDA","JEEP","MERCEDES BENZ","MERCEDES-BENZ","IVECO",
   "HYUNDAI","KIA","SUZUKI","CHERY","AUDI","BMW","DODGE","RAM"];
 const v10VehAttrs=z=>{
   z=z||"";
   let marca="";
   for(const x of V10_MARCAS){ if(new RegExp("\\\\b"+x.replace("-","[- ]")+"\\\\b").test(z)){marca=x.replace("VW","VOLKSWAGEN");break;} }
   // Dominio argentino: se exige contexto de dominio/patente o formatos fuertes para reducir falsos positivos.
   let dominio="";
   const dm=z.match(/\b(?:DOMINIO|PATENTE|CHAPA(?: PATENTE)?)\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{2}\s?\d{3}\s?[A-Z]{2}|[A-Z]{3}\s?\d{3})\b/);
   if(dm) dominio=dm[1].replace(/\s/g,"");
   else{
     const strong=z.match(/\b([A-Z]{2}\d{3}[A-Z]{2}|[A-Z]{3}\d{3})\b/);
     if(strong) dominio=strong[1];
   }
   let modelo="";
   if(marca){
     const mm=z.match(new RegExp("\\\\b"+marca.replace("VOLKSWAGEN","(?:VOLKSWAGEN|VW)").replace("-","[- ]")+"\\\\b\\\\s+([A-Z0-9][A-Z0-9 .-]{1,24})"));
     if(mm){
       modelo=mm[1].split(/\b(?:DOMINIO|PATENTE|COLOR|MODELO AÑO|AÑO|QUE|EL CUAL|LA CUAL|CON)\b/)[0].trim();
       modelo=modelo.replace(/\s+/g," ").slice(0,24);
     }
   }
   return {marca,modelo,dominio};
 };
 const v10SameVehicle=(a,b)=>{
   if(!a||!b)return false;
   if(a.dominio&&b.dominio)return a.dominio===b.dominio;
   if(a.marca&&b.marca&&a.marca!==b.marca)return false;
   if(a.marca&&b.marca&&a.modelo&&b.modelo){
     return a.marca===b.marca && (a.modelo===b.modelo || a.modelo.includes(b.modelo) || b.modelo.includes(a.modelo));
   }
   return false;
 };

 const RX={
   auto:/\b(?:AUTO|AUTOMOVIL|VEHICULO|RODADO|CAMIONETA|CAMION|UTILITARIO|FURGON|UNIDAD)\b/,
   moto:/\b(?:MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR|SCOOTER)\b/,
   bici:/\b(?:BICICLETA|BICI)\b/,
   parte:/\b(?:RUEDA(?:S)?|NEUMATICO(?:S)?|CUBIERTA(?:S)?|AUXILIO|LLANTA(?:S)?|BATERIA|PATENTE|CHAPA PATENTE|ESTEREO|OPTICA(?:S)?|ESPEJO(?:S)?|FARO(?:S)?|PARAGOLPE|CATALIZADOR|AUTOPARTE(?:S)?)\b/,
   pert:/\b(?:CELULAR|TELEFONO|IPHONE|MOCHILA|BOLSO|MORRAL|CARTERA|BILLETERA|DOCUMENTACION|DOCUMENTOS|HERRAMIENTA(?:S)?|PERTENENCIA(?:S)?|DINERO|EFECTIVO|MERCADERIA|PAQUETE(?:S)?)\b/,
   theft:/\b(?:SUSTRAE|SUSTRAEN|SUSTRAJO|SUSTRAJERON|SUSTRAIDO|SUSTRAIDA|ROBA|ROBAN|ROBO|ROBARON|ROBADO|ROBADA|APODERA|APODERAN|APODERO|APODERARON|DESPOJA|DESPOJAN|DESPOJARON|SE LLEVA|SE LLEVAN|SE LLEVO|SE LLEVARON)\b/,
   recover:/\b(?:HALLAN|HALLARON|HALLADO|HALLADA|LOCALIZAN|LOCALIZARON|LOCALIZADO|LOCALIZADA|RECUPERAN|RECUPERARON|RECUPERADO|RECUPERADA|ENCUENTRAN|ENCONTRARON|ENCONTRADO|ENCONTRADA|DAN CON|DIERON CON|APARECIO|APARECIDO)\b/,
   parkedLoss:/\b(?:DEJO|DEJA|HABIA DEJADO)\b.{0,120}\b(?:ESTACIONADO|ESTACIONADA)\b.{0,300}\b(?:NO SE ENCONTRABA|YA NO ESTABA|NO ESTABA|FALTABA|DESAPARECIDO)\b/,
   authors:/\b(?:AUTOR(?:ES)?|SUJETO(?:S)?|MASCULINO(?:S)?|DELINCUENTE(?:S)?|MALVIVIENTE(?:S)?|IMPUTADO(?:S)?)\b/,
   police:/\b(?:PERSONAL POLICIAL|EFECTIVO(?:S)?|POLICIA|MOVIL|COMANDO)\b/,
   means:/\b(?:A BORDO DE|SE MOVILIZABAN EN|CIRCULABAN EN|ARRIBARON EN|LLEGARON EN|HUYERON EN|ESCAPARON EN|SE DIERON A LA FUGA EN)\b/,
   coref:/\b(?:(?:DICHO|DICHA|MISMO|MISMA|MENCIONADO|MENCIONADA|REFERIDO|REFERIDA|CITADO|CITADA)\s+(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)|(?:EL|LA)\s+(?:MISMO|MISMA)\s+(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)|(?:VEHICULO|RODADO|UNIDAD)\s+EN\s+CUESTION|(?:EL|LA)\s+(?:RODADO|VEHICULO|UNIDAD))\b/,
   past:/\b(?:AYER|DIA ANTERIOR|DIAS ANTES|HORAS ANTES|ANTERIORMENTE|CON FECHA ANTERIOR)\b/,
   later:/\b(?:POSTERIORMENTE|LUEGO|DESPUES|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A CONTINUACION|SEGUIDAMENTE|MIENTRAS|EN EL TRANSCURSO)\b/,
   badRecovery:/\b(?:NO|SIN)\b.{0,50}\b(?:HALLAR|HALLADO|ENCONTRAR|ENCONTRADO|LOCALIZAR|LOCALIZADO|RECUPERAR|RECUPERADO)\b|\b(?:BUSCAR|BUSCANDO|RASTRILLAJE|PARA ENCONTRAR|PARA HALLAR)\b/
 };
 // V10.2 — DIAGNÓSTICO PURO DEL INPUT.
 ficha.diag_texto_recibido=t||"";
 ficha.diag_longitud=(t||"").length;
 ficha.diag_oraciones=v10Sent.length;
 ficha.diag_verbos_sustraccion=((t||"").match(new RegExp(RX.theft.source,"g"))||[]).length;
 ficha.diag_verbos_recuperacion=((t||"").match(new RegExp(RX.recover.source,"g"))||[]).length;
 const diagObjs=[];
 if(RX.auto.test(t||""))diagObjs.push("AUTOMOTOR");
 if(RX.moto.test(t||""))diagObjs.push("MOTOVEHICULO");
 if(RX.bici.test(t||""))diagObjs.push("BICICLETA");
 if(RX.parte.test(t||""))diagObjs.push("AUTOPARTE");
 if(RX.pert.test(t||""))diagObjs.push("PERTENENCIA");
 ficha.diag_objetos=diagObjs.join(" | ")||"NINGUNO";

 const tipoLocal=z=>{
   if(RX.bici.test(z))return "BICICLETA";
   if(RX.moto.test(z))return "MOTOVEHICULO";
   if(RX.parte.test(z))return "AUTOPARTE";
   if(RX.pert.test(z))return "PERTENENCIA";
   if(RX.auto.test(z))return "AUTOMOTOR";
   return "INDETERMINADO";
 };
 const tiempo=z=>RX.past.test(z)?"ANTERIOR":(RX.later.test(z)?"POSTERIOR":"ACTUAL");
 const sujeto=z=>RX.police.test(z)?"POLICIA":(RX.authors.test(z)?"AUTORES":"NO EXPRESO");

 // V10.13 — POLARIDAD DEL EVENTO.
 // Un verbo de hallazgo no vale como recuperación positiva si está negado,
 // hipotético, buscado o sólo expresa una finalidad. Se evalúa el entorno
 // local del verbo, no una frase exacta ni un expediente particular.
 const v1011RecoveryPolarity=(z,idx)=>{
   const a=Math.max(0,idx-95), b=Math.min(z.length,idx+120);
   const w=z.slice(a,b);
   const before=z.slice(a,idx);
   const negative=/\b(?:NO|NUNCA|SIN)\b[^.;]{0,65}$/.test(before) ||
     /\b(?:NO SE LOGR[AO]|NO LOGR[AO]N?|NO PUD[OIERAN]*|SIN RESULTADO|RESULTADO NEGATIVO|INFRUCTUOS[OA])\b/.test(w);
   const search=/\b(?:BUSCA(?:R|N|BAN|NDO)?|RASTRILLAJE|RECORRIDA|OPERATIVO|COMISIONAD[OA]S?|A FIN DE|PARA|CON EL OBJETO DE)\b[^.;]{0,90}$/.test(before);
   const conditional=/\b(?:PODRIA|HABRIA QUE|INTENTAN|INTENTARON|PROCURAN|PROCURARON)\b/.test(before);
   if(negative)return "NEGATIVA";
   if(search||conditional)return "NO AFIRMADA";
   return "POSITIVA";
 };

 // V10.13 — DIRECCIÓN TEMPORAL DEL HECHO.
 // Distingue el evento actual de un antecedente citado para explicar el
 // procedimiento presente.
 const v1011Temporalidad=(z,action)=>{
   if(action==="SUSTRAE" &&
      /\b(?:HABIA SIDO|HABRIA SIDO|POSEIA PEDIDO|PEDIDO DE SECUESTRO|DENUNCIA PREVIA|DENUNCIAD[OA] COMO SUSTRAID[OA]|SUSTRAID[OA] CON FECHA|HECHO OCURRIDO|FECHA ANTERIOR)\b/.test(z))
     return "ANTERIOR";
   if(action==="RECUPERA/HALLA" &&
      /\b(?:EN LA FECHA|DIA DE LA FECHA|EN CIRCUNSTANCIAS QUE|PERSONAL POLICIAL|COMISIONADOS|RECORRIENDO|PATRULLANDO|OBSERVAN|DIVISAN|CONSTATA)\b/.test(z))
     return RX.later.test(z)?"POSTERIOR":"ACTUAL";
   return tiempo(z);
 };
 const rels=[];
 let v10EntitySeq=0;
 const v10Entities=[];
 const entityFor=(tipo,rol,z,i)=>{
   const family=(rol==="VEHICULO DE AUTORES")?"AUTOR_TRANSPORTE":
     (rol==="OBJETO SUSTRAIDO"?"OBJETO_DELITO":
     (rol==="OBJETO RECUPERADO"?"OBJETO_RECUPERADO":"CONTEXTO"));
   // V10.6: no se hereda identidad sólo porque ambos objetos sean "AUTOMOTOR".
   // La continuidad se resuelve luego con antecedente + referencia + cronología.
   const id="E"+(++v10EntitySeq);
   const attrs=(tipo==="AUTOMOTOR"||tipo==="MOTOVEHICULO")?v10VehAttrs(z):{marca:"",modelo:"",dominio:""};
   v10Entities.push({id,tipo,rol,family,i,texto:z,attrs});
   return id;
 };
 const add=(i,su,ac,obj,rol,tm,conf,z)=>{
   const eid=entityFor(obj,rol,z,i);
   const ent=v10Entities.find(e=>e.id===eid);
   rels.push({i,su,ac,obj,rol,tm,conf,z,eid,attrs:ent?ent.attrs:v10VehAttrs(z)});
 };

 // V10.8 — ACCIÓN → OBJETO.
 // En vez de tomar cualquier sustantivo cercano, se prioriza el objeto dentro
 // de la misma cláusula del verbo y se penalizan objetos subordinados ("con",
 // "conteniendo", "en cuyo interior", "faltante de", etc.).
 const v10ClauseAfter=(z,pos,max=230)=>{
   let x=z.slice(pos,Math.min(z.length,pos+max));
   const cut=x.search(/\b(?:POSTERIORMENTE|LUEGO|DESPUES|SEGUIDAMENTE|MIENTRAS|QUIEN|QUIENES|DONDE|MOMENTO EN QUE|POR LO QUE)\b/);
   if(cut>15)x=x.slice(0,cut);
   return x;
 };
 const v10ObjectCandidates=(x)=>{
   const out=[];
   const push=(tipo,rx,score)=>{
     const m=x.match(rx); if(m) out.push({tipo,pos:m.index,score});
   };
   push("AUTOPARTE",RX.parte,75);
   push("PERTENENCIA",RX.pert,65);
   // V10.23.1 — jerarquía semántica del objeto víctima.
   // Una identificación explícita (MOTO/MOTOCICLETA/BICICLETA) debe vencer
   // a nombres genéricos como VEHICULO/RODADO/UNIDAD. En cambio un tipo
   // automotor explícito (AUTO/CAMIONETA/CAMION/UTILITARIO/FURGON) conserva
   // máxima prioridad. Así no confundimos "el rodado, una motocicleta"
   // con un automóvil, ni descartamos "autores en moto roban un auto".
   push("BICICLETA",RX.bici,98);
   push("MOTOVEHICULO",RX.moto,100);
   const autoEspecifico=/\b(?:AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|FURGON)\b/;
   const autoGenerico=/\b(?:VEHICULO|RODADO|UNIDAD)\b/;
   push("AUTOMOTOR",autoEspecifico,105);
   push("AUTOMOTOR",autoGenerico,72);
   return out;
 };
 const v10ChooseActionObject=(z,verbIndex,action)=>{
   const after=v10ClauseAfter(z,verbIndex,240);
   let cand=v10ObjectCandidates(after);
   if(!cand.length)return {tipo:"INDETERMINADO",conf:"BAJA"};

   // Distancia importa, pero el objeto principal no debe ser desplazado por
   // contenido/pertenencias mencionadas después.
   for(const c of cand){
     c.final=c.score-Math.min(c.pos,120)*0.22;
     const pre=after.slice(Math.max(0,c.pos-45),c.pos);
     if(/\b(?:CONTENIENDO|CONTIENE|EN SU INTERIOR|EN EL INTERIOR|DENTRO DE|CON|JUNTO CON|CARGADO CON)\b/.test(pre))
       c.final-=35;
     if(/\b(?:FALTANTE DE|FALTANDO|NO POSEIA|NO TENIA|SIN)\b/.test(pre))
       c.final-=30;
     if(action==="RECUPERA/HALLA" && (c.tipo==="PERTENENCIA"||c.tipo==="AUTOPARTE") &&
        /\b(?:VEHICULO|RODADO|AUTO|CAMIONETA|UNIDAD)\b/.test(after.slice(0,Math.max(1,c.pos))))
       c.final-=45;
   }
   cand.sort((a,b)=>b.final-a.final || a.pos-b.pos);
   const best=cand[0];
   return {tipo:best.tipo,conf:best.final>=75?"ALTA":best.final>=50?"MEDIA":"BAJA"};
 };

 // Cada oración se interpreta como relaciones acción→objeto locales.
 v10Sent.forEach((z,i)=>{
   const thefts=[...z.matchAll(new RegExp(RX.theft.source,"g"))];
   for(const m of thefts){
     const sel=v10ChooseActionObject(z,m.index,"SUSTRAE");
     let obj=sel.tipo,conf=sel.conf;
     // Coreferencia sólo completa un objeto indeterminado; no desplaza un
     // objeto explícito de la cláusula.
     if(obj==="INDETERMINADO" && RX.coref.test(z)){obj="AUTOMOTOR";conf="MEDIA";}
     add(i,sujeto(z),"SUSTRAE",obj,"OBJETO SUSTRAIDO",v1011Temporalidad(z,"SUSTRAE"),conf,z);
   }

   // Levantamiento narrado sin verbo "sustraer": estacionado -> desaparece.
   if(RX.parkedLoss.test(z)){
     let obj=RX.moto.test(z)?"MOTOVEHICULO":(RX.bici.test(z)?"BICICLETA":(RX.auto.test(z)?"AUTOMOTOR":"INDETERMINADO"));
     add(i,"NO EXPRESO","SUSTRAE",obj,"OBJETO SUSTRAIDO",tiempo(z),obj==="INDETERMINADO"?"BAJA":"ALTA",z);
   }

   // Vehículo utilizado por autores es una relación contextual separada.
   if(RX.authors.test(z)&&RX.means.test(z)){
     const obj=RX.moto.test(z)?"MOTOVEHICULO":(RX.auto.test(z)?"AUTOMOTOR":"INDETERMINADO");
     if(obj!=="INDETERMINADO")add(i,"AUTORES","SE MOVILIZAN EN",obj,"VEHICULO DE AUTORES",tiempo(z),"ALTA",z);
   }

   const recMatches=[...z.matchAll(new RegExp(RX.recover.source,"g"))];
   for(const rm of recMatches){
     const pol=v1011RecoveryPolarity(z,rm.index);
     if(pol!=="POSITIVA") continue;
     const sel=v10ChooseActionObject(z,rm.index,"RECUPERA/HALLA");
     let obj=sel.tipo,conf=sel.conf;
     const prev=[...rels].reverse().find(r=>r.i<=i&&r.ac==="SUSTRAE"&&(r.obj==="AUTOMOTOR"||r.obj==="MOTOVEHICULO"));
     if((obj==="INDETERMINADO"||RX.coref.test(z))&&prev){
       obj=prev.obj; conf=obj==="INDETERMINADO"?"MEDIA":"ALTA";
     }
     add(i,sujeto(z),"RECUPERA/HALLA",obj,"OBJETO RECUPERADO",v1011Temporalidad(z,"RECUPERA/HALLA"),conf,z);
   }
 });

 // Quitar duplicados semánticos de una misma oración.
 const uniq=[];
 for(const r of rels){
   if(!uniq.some(q=>q.i===r.i&&q.ac===r.ac&&q.obj===r.obj&&q.rol===r.rol))uniq.push(r);
 }
 uniq.sort((a,b)=>a.i-b.i || (a.ac==="SUSTRAE"?-1:1));

 // V10.6 — CONTINUIDAD: resolver "el rodado / dicho vehículo / la unidad"
 // contra una entidad del delito previa, sin mezclar vehículo de autores,
 // autopartes ni pertenencias.
 const explicitTemporalAnterior=z=>RX.past.test(z) ||
   /\b(?:HABIA SIDO|HABRIA SIDO|POSEIA PEDIDO|PEDIDO DE SECUESTRO|DENUNCIA PREVIA|SUSTRAIDO CON FECHA|SUSTRAIDA CON FECHA)\b/.test(z);
 const explicitTemporalPosterior=z=>RX.later.test(z) ||
   /\b(?:AL POCO TIEMPO|MAS TARDE|ACTO SEGUIDO|EN ESE MOMENTO|DURANTE LA DENUNCIA|MIENTRAS RADICABA|MIENTRAS FORMULABA)\b/.test(z);

 for(const r of uniq){
   if(r.ac!=="RECUPERA/HALLA" || !(r.obj==="AUTOMOTOR"||r.obj==="MOTOVEHICULO")) continue;
   const prev=[...uniq].reverse().find(q=>
     q!==r && q.i<=r.i && q.ac==="SUSTRAE" &&
     q.rol==="OBJETO SUSTRAIDO" && q.obj===r.obj
   );
   if(!prev) continue;
   const tramo=v10Sent.slice(prev.i,r.i+1).join(" ");
   const mismaIdentidad=v10SameVehicle(prev.attrs,r.attrs);
   const continuidad =
     mismaIdentidad ||
     RX.coref.test(r.z) ||
     explicitTemporalPosterior(r.z) ||
     /\b(?:INFORMA|INFORMAN|AVISA|AVISAN|COMUNICA|COMUNICAN|VIA RADIAL|RADIAL|911|PERSONAL POLICIAL)\b/.test(tramo);
   if(continuidad && !explicitTemporalAnterior(r.z)){
     r.eid=prev.eid;
     r.conf = (r.conf==="BAJA"?"MEDIA":"ALTA");
   }
 }

 const robos=uniq.filter(r=>r.ac==="SUSTRAE"&&r.obj!=="INDETERMINADO");
 // V10.23.3 — JERARQUIA DE OBJETOS CONCURRENTES.
 // Una pertenencia puede coexistir con el robo del vehiculo completo. En ese
 // caso no compiten como objetos equivalentes: si la narracion acredita que
 // los autores se apoderan / se llevan / huyen con el automotor, el automotor
 // es el objeto principal del auditor y las pertenencias quedan subordinadas.
 // A la inversa, mencionar un auto, sus llaves o elementos dentro del mismo no
 // demuestra por si solo sustraccion completa.

 const procedure=/\b(ACTA DE PROCEDI|ACTA DE PROCEDIMIENTO|RECORRIDA|COMANDO DE PATRULLAS|MOVIL POLICIAL|SOMOS COMISIONADOS|ALERTADOS POR 911|OPERADOR DE RADIO|CURSAR (?:POR )?SISTEMA)\b/.test(t);
 const victimComplaint=/\b(DENUNCIA|DENUNCIANTE|RESULTA SER (?:TITULAR|POSEEDOR)|DEJA ESTACIONADO|DEJO ESTACIONADO|CONSTATA)\b/.test(t);

 const theftStrong=near(t,V,S,300)||near(t,S,V,300)
   ||/\b(SE LO|SE LA|LO|LA) (?:HABRIAN |HABRIA )?(?:SUSTRAIDO|ROBADO|LLEVADO)\b/.test(t)
   ||/\b(?:TOMAN|TOMARON|SUSTRAEN|SUSTRAJERON) (?:LA |LAS )?LLAVE(?:S)?\b.{0,260}\b(?:SE DAN|DANDOSE|DARSE) A LA FUGA\b/.test(t)
   ||/\b(?:SUBEN|SUBIERON|ABORDAN|ABORDARON) (?:A |AL )?(?:SU |EL )?(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,220}\b(?:FUGA|RETIRAN|HUYEN)\b/.test(t)
   ||/\b(?:DEJO|DEJA|HABIA DEJADO) (?:ESTACIONADO )?(?:SU |EL )?(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,450}\b(?:NO SE ENCONTRABA|YA NO ESTABA|CONSTATA.{0,100}(?:FALTANTE|SUSTRA))\b/.test(t)
   ||/\b(?:DESPOJA|DESPOJAN|DESPOJARON|DESPOJARLO|DESPOJARLA)\b.{0,160}\b(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b/.test(t)
   ||/\b(?:LE|LO|LA) SUSTRA(?:EN|JERON|JO|E)\b.{0,180}\b(?:SU |EL |LA )?(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b/.test(t)
   ||/\b(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,180}\b(?:LE|LO|LA) (?:SUSTRAEN|SUSTRAJERON|ROB[A-Z]*|LLEVAN|LLEVARON)\b/.test(t)
   ||/\bCONSTATA\b.{0,140}\b(?:QUE )?(?:SU |EL |LA )?(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,80}\b(?:NO ESTABA|NO SE ENCONTRABA|HABIA DESAPARECIDO)\b/.test(t)
   ||/\b(?:OBLIGA|OBLIGAN|INTIMA|INTIMAN)\b.{0,180}\bDESCEND(?:ER|ER DEL|A|E)\b.{0,260}\b(?:SE RETIRA|SE RETIRAN|HUYE|HUYEN|FUGA)\b.{0,180}\b(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b/.test(t);

 // V9.15 — capa semántica de ESTADO. Las frases aportan evidencia; no deciden categoría por sí solas.
 // Evaluamos recuperación en segmentos locales para no convertir búsqueda, negación o hipótesis en un hallazgo real.
 const segments=t.split(/[.!?;\n]+/).map(x=>x.trim()).filter(Boolean);
 const vehicleToken=/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD)\b/;
 const recoveryToken=/\b(?:HALLA|HALLAN|HALLARON|HALLADO|HALLADA|LOCALIZA|LOCALIZAN|LOCALIZARON|LOCALIZADO|LOCALIZADA|RECUPERA|RECUPERAN|RECUPERARON|RECUPERADO|RECUPERADA|ENCUENTRA|ENCUENTRAN|ENCONTRARON|ENCONTRADO|ENCONTRADA|HABIDO|HABIDA|APARECIO|APARECIDO)\b/;
 const searchState=/\b(?:BUSCA|BUSCAR|BUSCANDO|RASTRILLA|RASTRILLAJE|RECORRE|RECORRIO|DAR|DIO|DA|DANDO)\b.{0,100}\b(?:VER SI|ENCONTRAR|HALLAR|LOCALIZAR|UBICAR)\b|\bPARA (?:VER SI )?(?:ENCONTRAR|HALLAR|LOCALIZAR|UBICAR)\b/;
 const negRecovery=/\b(?:NO|SIN)\b.{0,55}\b(?:ENCONTRAR|ENCONTRADO|HALLAR|HALLADO|LOCALIZAR|LOCALIZADO|RECUPERAR|RECUPERADO|DAR CON)\b|\b(?:NO POSEE|NO TIENE|SIN)\b.{0,60}\b(?:RASTREO|GPS|LOJACK|GEOLOCALIZACION)\b/;
 const hypotheticalRecovery=/\b(?:PODRIA|PODRIA HABER|HABRIA|POSIBLEMENTE|PRESUNTAMENTE|TAL VEZ)\b.{0,80}\b(?:ENCONTR|HALL|LOCALIZ|RECUPER|ABANDON)\w*/;
 const questionRecovery=/\b(?:CONSULTAD[OA]|PREGUNTAD[OA])\b.{0,100}\b(?:ENCONTR|HALL|LOCALIZ|RECUPER)\w*/;
 const assertedRecoverySegments=segments.filter(s=>vehicleToken.test(s)&&recoveryToken.test(s)&&!searchState.test(s)&&!negRecovery.test(s)&&!hypotheticalRecovery.test(s)&&!questionRecovery.test(s));
 const recoveryAsserted=assertedRecoverySegments.length>0;
 const recoveryOnlyNonAsserted=segments.some(s=>recoveryToken.test(s)&&(searchState.test(s)||negRecovery.test(s)||hypotheticalRecovery.test(s)||questionRecovery.test(s)))&&!recoveryAsserted;
  // V9.18 — CADENA SEMANTICA CON IDENTIDAD DE OBJETO.
  // OBJETO SUSTRAIDO -> ACCION -> TEMPORALIDAD -> MISMO OBJETO -> RECUPERACION.
  // V9.19 — PRIMERO RESOLVEMOS EL OBJETO DEL DELITO.
  // OBJETO -> SUSTRACCION -> TEMPORALIDAD -> IDENTIDAD -> RECUPERACION.
  const eventVehicle=/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD|MOTOVEHICULO|MOTOCICLETA|MOTO)\b/;
  const eventAutoPart=/\b(?:RUEDA|RUEDAS|CUBIERTA|CUBIERTAS|NEUMATICO|NEUMATICOS|AUXILIO|RUEDA DE AUXILIO|BATERIA|ESTEREO|PATENTE|CHAPA PATENTE|ESPEJO|ESPEJOS|LLANTA|LLANTAS|OPTICA|OPTICAS|FARO|FAROS|PARAGOLPE|CATALIZADOR|AUTOPARTE|AUTOPARTES)\b/;
  const eventBelonging=/\b(?:CELULAR|TELEFONO|IPHONE|MOCHILA|BOLSO|MORRAL|CARTERA|BILLETERA|DOCUMENTACION|DOCUMENTOS|HERRAMIENTA|HERRAMIENTAS|PERTENENCIA|PERTENENCIAS|DINERO|EFECTIVO|MERCADERIA|PAQUETE|PAQUETES)\b/;
  const eventOtherObject=/\b(?:BICICLETA|BICI)\b/;
  const eventTheft=/\b(?:SUSTRAE|SUSTRAEN|SUSTRAJO|SUSTRAJERON|SUSTRAIDO|SUSTRAIDA|ROBA|ROBAN|ROBO|ROBARON|ROBADO|ROBADA|APODERA|APODERAN|APODERO|APODERARON|SE LLEVA|SE LLEVAN|SE LLEVO|SE LLEVARON|DESPOJA|DESPOJAN|DESPOJARON)\b/;

  const recoveryActive=/\b(?:HALLAN|HALLARON|LOCALIZA|LOCALIZAN|LOCALIZARON|RECUPERA|RECUPERAN|RECUPERARON|ENCUENTRAN|ENCONTRARON|DAN CON|DIERON CON|LOGRAN DAR CON|LOGRARON DAR CON)\b/;
  const recoveryResult=/\b(?:FUE|ES|RESULTA|HABIA SIDO|HABRIA SIDO|HA SIDO)\s+(?:HALLADO|HALLADA|LOCALIZADO|LOCALIZADA|RECUPERADO|RECUPERADA|ENCONTRADO|ENCONTRADA|HABIDO|HABIDA)\b/;
  const recoveryParticipial=/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD|MOTOVEHICULO|MOTOCICLETA|MOTO)\b.{0,100}\b(?:HALLADO|HALLADA|LOCALIZADO|LOCALIZADA|RECUPERADO|RECUPERADA|ENCONTRADO|ENCONTRADA|ABANDONADO|ABANDONADA)\b/;

  const eventSource=/\b(?:INFORMA|INFORMAN|INFORMARON|AVISA|AVISAN|AVISARON|COMUNICA|COMUNICAN|COMUNICARON|MODULA|MODULAN|MODULARON|DAN AVISO|DIO AVISO|VIA RADIAL|RADIAL|911|PERSONAL POLICIAL|MOVIL)\b/;
  const eventTemporal=/\b(?:POSTERIORMENTE|LUEGO|DESPUES|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A CONTINUACION|SEGUIDAMENTE|MIENTRAS|AL MOMENTO|EN EL TRANSCURSO)\b/;
  const eventSameVehicle=/\b(?:(?:DICHO|MISMO|MENCIONADO|REFERIDO|SU|EL|LA)\s+(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD|MOTOVEHICULO|MOTOCICLETA|MOTO)|(?:VEHICULO|RODADO) EN CUESTION)\b/;
  const vehicleIdentity=/\b(?:DOMINIO|PATENTE|CHASIS|MOTOR|MARCA|MODELO)\b/;

  const eventNodes=segments.map((seg,i)=>{
    const active=recoveryActive.test(seg), result=recoveryResult.test(seg), participial=recoveryParticipial.test(seg);
    return conFicha({
      i,s:seg,
      vehicle:eventVehicle.test(seg),
      autoPart:eventAutoPart.test(seg),
      belonging:eventBelonging.test(seg),
      otherObject:eventOtherObject.test(seg),
      theft:eventTheft.test(seg),
      recovery:active||result||participial,
      source:eventSource.test(seg),temporal:eventTemporal.test(seg),
      sameVehicle:eventSameVehicle.test(seg),identity:vehicleIdentity.test(seg),
      negated:negRecovery.test(seg),searching:searchState.test(seg),
      questioned:questionRecovery.test(seg),hypothetical:hypotheticalRecovery.test(seg)
    });
  });

  const sourceForRecovery=re=>{
    if(re.source)return true;
    const prev=eventNodes[re.i-1];
    return !!(prev&&prev.source&&!prev.theft&&!prev.recovery);
  };

  // Clasificador de OBJETO DEL DELITO.
  // No decide por una palabra aislada: pondera el objeto alrededor de la acción de sustracción.
  const theftObjectEvidence=eventNodes.map((e,i)=>{
    if(!e.theft)return null;
    const window=eventNodes.slice(Math.max(0,i-1),Math.min(eventNodes.length,i+2));
    let vehicleScore=0, partScore=0, belongingScore=0, otherScore=0;

    for(const x of window){
      if(x.vehicle) vehicleScore += (x.i===i ? 3 : 1);
      if(x.sameVehicle||x.identity) vehicleScore += 2;
      if(x.autoPart) partScore += (x.i===i ? 4 : 2);
      if(x.belonging) belongingScore += (x.i===i ? 4 : 2);
      if(x.otherObject) otherScore += (x.i===i ? 4 : 2);
    }

    // Si una parte/pertenencia aparece ligada a la misma acción, el vehículo mencionado
    // puede ser contexto/contenedor y no el objeto sustraído.
    let role="INDETERMINADO";
    const nonVehicle=Math.max(partScore,belongingScore,otherScore);
    if(vehicleScore>=3 && vehicleScore>=nonVehicle+2) role="VEHICULO_COMPLETO";
    else if(partScore>=3 && partScore>=vehicleScore) role="AUTOPARTE";
    else if(belongingScore>=3 && belongingScore>=vehicleScore) role="PERTENENCIA";
    else if(otherScore>=3 && otherScore>=vehicleScore) role="OTRO";
    else if(vehicleScore>=2 && nonVehicle===0) role="VEHICULO_COMPLETO";

    return conFicha({i,role,vehicleScore,partScore,belongingScore,otherScore});
  }).filter(Boolean);

  const vehicleTheftEvidence=theftObjectEvidence.filter(x=>x.role==="VEHICULO_COMPLETO");
  const nonVehicleTheftEvidence=theftObjectEvidence.filter(x=>x.role==="AUTOPARTE"||x.role==="PERTENENCIA"||x.role==="OTRO");
  const ambiguousTheftEvidence=theftObjectEvidence.filter(x=>x.role==="INDETERMINADO");

  const strictRecoveryEvent=eventNodes.some(e=>e.recovery&&!e.negated&&!e.searching&&!e.questioned);
  const sourcedRecovery=eventNodes.some(e=>e.recovery&&!e.negated&&!e.searching&&!e.questioned&&sourceForRecovery(e));

  let linkedRecoveryAfterTheft=false;
  const recoveryNodes=eventNodes.filter(e=>e.recovery&&!e.negated&&!e.searching&&!e.questioned);

  // Solo buscamos recuperación del automotor después de demostrar que el objeto sustraído
  // fue el vehículo completo.
  for(const teInfo of vehicleTheftEvidence){
    const te=eventNodes[teInfo.i];
    for(const re of recoveryNodes){
      if(re.i<te.i)continue;
      const gap=re.i-te.i, bridge=eventNodes.slice(te.i,re.i+1);

      const recoveryNamesVehicle=re.vehicle||re.sameVehicle||re.identity;
      const bridgeNamesSameVehicle=bridge.slice(1).some(x=>x.sameVehicle||x.identity);

      // Recuperación de una parte/pertenencia/otro objeto no recupera al automotor.
      const recoveryNamesCompetingObject=re.autoPart||re.belonging||re.otherObject;
      if(recoveryNamesCompetingObject&&!recoveryNamesVehicle)continue;

      const objectIdentity=recoveryNamesVehicle||(gap<=2&&bridgeNamesSameVehicle);
      const temporalLink=re.temporal||bridge.some(x=>x.temporal)||(gap<=1&&recoveryNamesVehicle);
      const asserted=!re.hypothetical||sourceForRecovery(re);

      if(objectIdentity&&temporalLink&&asserted){
        linkedRecoveryAfterTheft=true;
        break;
      }
    }
    if(linkedRecoveryAfterTheft)break;
  }

 // V9.22.1 — REPRESENTACION DEL HECHO, optimizada.
 // Evitamos regex dinamicas amplias sobre relatos completos. Cada decision se toma
 // sobre el segmento local ya construido por el motor.
 const partTargetLocal=/\b(?:RUEDA(?: DE AUXILIO)?|RUEDAS|CUBIERTA|CUBIERTAS|NEUMATICO|NEUMATICOS|AUXILIO|BATERIA|ESTEREO|PATENTE|CHAPA PATENTE|ESPEJO|ESPEJOS|LLANTA|LLANTAS|OPTICA|OPTICAS|FARO|FAROS|PARAGOLPE|CATALIZADOR|AUTOPARTE|AUTOPARTES)\b/;
 const belongingTargetLocal=/\b(?:CELULAR|TELEFONO|IPHONE|MOCHILA|BOLSO|MORRAL|CARTERA|BILLETERA|DOCUMENTACION|DOCUMENTOS|HERRAMIENTA|HERRAMIENTAS|PERTENENCIA|PERTENENCIAS|DINERO|EFECTIVO|MERCADERIA|PAQUETE|PAQUETES)\b/;
 const containerRelation=/\b(?:DEL INTERIOR|DEL|DE SU|DE MI|DE ESTE|DE DICHO)\b/;
 const vehicleTakenLocal=/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD|MOTOVEHICULO|MOTOCICLETA|MOTO)\b/;
 const vehiclePronounTaken=/\b(?:SE LO|LO|SE LA|LA)\s+(?:LLEVAN|LLEVARON|SUSTRAEN|SUSTRAJERON|ROBAN|ROBARON)\b/;
 const vehicleGoneLocal=/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|MOTOCICLETA|MOTO)\b.{0,80}\b(?:NO ESTABA|YA NO ESTABA|FALTABA|NO SE ENCONTRABA)\b/;

 const theftFrames=eventNodes.map((e,i)=>{
   if(!e.theft)return null;
   const seg=e.s.slice(0,900); // limite defensivo: el segmento local basta para resolver el objeto.
   const hasPart=partTargetLocal.test(seg);
   const hasBelonging=belongingTargetLocal.test(seg);
   const hasVehicle=vehicleTakenLocal.test(seg);
   const hasContainer=containerRelation.test(seg);

   // Una parte nombrada junto al rodado se interpreta como parte-objetivo salvo que
   // exista evidencia independiente de que también se llevaron el vehículo completo.
   let object="INDETERMINADO", confidence=0;
   if(hasPart && hasVehicle){
     object="AUTOPARTE"; confidence=4;
   }else if(hasBelonging && hasVehicle && hasContainer){
     object="PERTENENCIA"; confidence=4;
   }else if(e.otherObject && !hasVehicle){
     object="OTRO"; confidence=4;
   }else if(hasVehicle && !hasPart && !(hasBelonging&&hasContainer)){
     object="VEHICULO_COMPLETO"; confidence=(e.sameVehicle||e.identity)?4:3;
   }else if((vehiclePronounTaken.test(seg)||vehicleGoneLocal.test(seg))&&!hasPart){
     object="VEHICULO_COMPLETO"; confidence=3;
   }
   return conFicha({i,object,confidence,seg});
 }).filter(Boolean);

 const frameWholeVehicle=theftFrames.filter(x=>x.object==="VEHICULO_COMPLETO");
 const frameNonVehicle=theftFrames.filter(x=>["AUTOPARTE","PERTENENCIA","OTRO"].includes(x.object));
 const frameAmbiguous=theftFrames.filter(x=>x.object==="INDETERMINADO");
 const relationOnlyNonVehicle=
   frameNonVehicle.length>0 && frameWholeVehicle.length===0 && frameAmbiguous.length===0;


 // V9.21 — CONFIANZA SEMANTICA PARA INMEDIATO.
 // No buscamos una frase obligatoria: acumulamos evidencia independiente.
 const semanticVehicleTheftConfirmed=frameWholeVehicle.length>0;
 const semanticOnlyNonVehicleTheft=
   relationOnlyNonVehicle || (frameNonVehicle.length>0 && frameWholeVehicle.length===0 && frameAmbiguous.length===0);
 const semanticTheftObjectAmbiguous=
   frameAmbiguous.length>0 && frameWholeVehicle.length===0;

 // Evidencia de continuidad de una denuncia actual de sustraccion hacia una recuperacion posterior.
 const recoveryCandidates=eventNodes.filter(e=>e.recovery&&!e.negated&&!e.searching&&!e.questioned);
 let semanticImmediateScore=0;
 let semanticImmediateReasons=[];
 let semanticRecoveryCompatible=false;

 if(semanticVehicleTheftConfirmed){
   semanticImmediateScore+=3;
   semanticImmediateReasons.push("objeto sustraído: vehículo completo");
 }

 // La cadena estricta sigue siendo la evidencia de mayor valor.
 if(linkedRecoveryAfterTheft){
   semanticImmediateScore+=4;
   semanticRecoveryCompatible=true;
   semanticImmediateReasons.push("recuperación vinculada al mismo vehículo");
 }

 // Segunda vía: continuidad narrativa fuerte aunque el relato no repita todos
 // los identificadores del rodado en la oración de recuperación.
 if(semanticVehicleTheftConfirmed && !linkedRecoveryAfterTheft){
   for(const teInfo of vehicleTheftEvidence){
     const te=eventNodes[teInfo.i];
     for(const re of recoveryCandidates){
       if(re.i<=te.i)continue;
       const gap=re.i-te.i;
       const bridge=eventNodes.slice(te.i,re.i+1);
       const recoveryNamesVehicle=re.vehicle||re.sameVehicle||re.identity;
       const competingOnly=(re.autoPart||re.belonging||re.otherObject)&&!recoveryNamesVehicle;
       if(competingOnly)continue;

       let local=0;
       let reasons=[];
       if(recoveryNamesVehicle){local+=3;reasons.push("recuperación refiere al automotor");}
       else if(gap<=2){local+=1;reasons.push("continuidad narrativa cercana");}

       if(re.temporal||bridge.some(x=>x.temporal)){local+=2;reasons.push("orden temporal posterior");}
       if(sourceForRecovery(re)){local+=1;reasons.push("fuente concreta de recuperación");}
       if(re.sameVehicle||re.identity){local+=2;reasons.push("identidad/referencia del mismo rodado");}
       if(gap<=2){local+=1;}
       else if(gap<=5){local+=0.5;}

       // El potencial informado ("habría sido hallado") no invalida por sí solo
       // cuando existe una fuente concreta ligada a ese evento.
       if(re.hypothetical&&!sourceForRecovery(re))local-=2;

       if(local>=4){
         semanticRecoveryCompatible=true;
         semanticImmediateScore+=local;
         semanticImmediateReasons.push(...reasons);
         break;
       }
     }
     if(semanticRecoveryCompatible)break;
   }
 }

 // Conflictos de objeto reducen confianza; si solo hay autoparte/pertenencia,
 // bloquean por completo INMEDIATO de automotor.
 if(nonVehicleTheftEvidence.length>0 && vehicleTheftEvidence.length>0){
   semanticImmediateScore-=2;
   semanticImmediateReasons.push("hay objetos sustraídos competidores");
 }
 if(semanticOnlyNonVehicleTheft){
   semanticImmediateScore=-99;
   semanticRecoveryCompatible=false;
 }

 // Umbrales explicables:
 // alta >=8; media 6-7.5; insuficiente <6.
 const semanticImmediateConfidence=
   semanticImmediateScore>=8 && semanticRecoveryCompatible ? "ALTA" :
   semanticImmediateScore>=6 && semanticRecoveryCompatible ? "MEDIA" : "BAJA";

const recoveryAction=/\b(?:HALLA|HALLAN|HALLADO|HALLADA|LOCALIZA|LOCALIZAN|LOCALIZADO|LOCALIZADA|RECUPERA|RECUPERAN|RECUPERADO|RECUPERADA|ENCONTRADO|ENCONTRADA|HABIDO|HABIDA)\b/;
 const recoveryStrong=
   /\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b.{0,220}\b(?:FUE|ES|RESULTA|SIENDO)? ?(?:HALLADO|HALLADA|LOCALIZADO|LOCALIZADA|RECUPERADO|RECUPERADA|ENCONTRADO|ENCONTRADA|HABIDO|HABIDA)\b/.test(t)
   ||/\b(?:HALLAN|HALLA|LOCALIZAN|LOCALIZA|RECUPERAN|RECUPERA|ENCONTRARON|HALLADO|LOCALIZADO|RECUPERADO)\b.{0,220}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b/.test(t)
   ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b.{0,180}\bABANDONAD[OA]\b/.test(t)
   ||/\bABANDONAD[OA]\b.{0,180}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b/.test(t);
 const seizureStatus=/\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO(?: ACTIVO)?\b/.test(t);
 const existingSeizure=/\b(?:POSEE|REGISTRA|SURGE|PESA|TENIA|TENÍA|CON|RESULTA (?:QUE )?(?:POSEE|REGISTRA)|ARROJA)\b.{0,120}\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO(?: ACTIVO)?\b/.test(t)
   ||/\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO(?: ACTIVO)?\b.{0,140}\b(?:VIGENTE|ACTIVO|FECHA|SOLICITADO|REQUERIDO)\b/.test(t);
 const newSeizure=/\b(?:SE DISPONE|DISPONE|SE SOLICITA|SOLICITA|SE IMPARTE|IMPARTE|SE CURSA|CURSA|SE INSERTA|INSERTA)\b.{0,120}\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO\b/.test(t);
 const policePossession=/\b(?:INTERCEPTA|INTERCEPTADO|IDENTIFICA|IDENTIFICADO|PROCEDE AL SECUESTRO|SECUESTRA|INCAUTA|INCAUTADO|HALLA|HALLADO|LOCALIZA|LOCALIZADO|ENCUENTRA|ENCONTRADO)\b.{0,260}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|DOMINIO|CHASIS|MOTOR)\b/.test(t)
   ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b.{0,260}\b(?:INTERCEPTA|INTERCEPTADO|PROCEDE AL SECUESTRO|SECUESTRA|INCAUTA|HALLA|HALLADO|LOCALIZA|LOCALIZADO|ENCUENTRA|ENCONTRADO)\b/.test(t);
 const immediateRecovery=
   /\b(?:AL MOMENTO DE (?:REALIZAR|RADICAR) LA DENUNCIA|MIENTRAS SE ENCONTRABA (?:REALIZANDO|RADICANDO).{0,60}DENUNCIA).{0,220}\b(?:FUE HABID[OA]|HABIA SIDO HABID[OA]|HABRIA SIDO HALLAD[OA]|HABIA SIDO HALLAD[OA]|HABIA APARECIDO)\b/.test(t)
   ||/\b(?:VEHICULO|RODADO|AUTO|CAMIONETA|UNIDAD).{0,80}\b(?:HABIA APARECIDO|HABRIA SIDO HALLAD[OA]|HABIA SIDO LOCALIZAD[OA]|FUE HABID[OA])\b/.test(t)
   ||/\b(?:TOMA CONOCIMIENTO|INFORMAN|AVISAN).{0,180}\b(?:UNIDAD|VEHICULO|RODADO|AUTO|CAMIONETA).{0,100}\b(?:HABIA SIDO LOCALIZAD[OA]|HABIA SIDO HALLAD[OA]|HABIA APARECIDO|FUE HABID[OA])\b/.test(t)
