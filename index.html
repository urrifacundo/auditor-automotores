<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditor de Automotores</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><main><h1>Auditor de Automotores</h1><p class="lead">Cassandra → candidatos → auditoría estricta → datos finales.</p><section class="card controls"><input id="file" type="file" accept=".xlsx,.xls"><button id="f1" disabled>1️⃣ Detectar candidatos</button><button id="f2" disabled>2️⃣ Auditar candidatos</button><button id="f3" disabled>3️⃣ Completar datos</button></section><div id="status">Cargá un Excel crudo de Cassandra.</div><section id="summary" class="summary"></section><section class="card downloads"><button id="d1" disabled>⬇ Filtro 1</button><button id="d2" disabled>⬇ Filtro 2</button><button id="d3" disabled>⬇ Final</button></section><section class="card"><table><thead><tr><th>Estado</th><th>N° interno</th><th>Carátula</th><th>Motivo</th><th>Relato</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
(function(){
let src=[],cand=[],accepted=[],rejected=[],finalRows=[];
const $=id=>document.getElementById(id), status=$("status");
const norm=s=>(s??"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const get=(r,names)=>{for(const n of names){const k=Object.keys(r).find(k=>norm(k)===norm(n));if(k)return r[k]}return ""};
const txt=r=>norm(get(r,["relato","descripcion","narrativa","hecho"])), car=r=>norm(get(r,["analisis_caratula","caratula"])), calif=r=>norm(get(r,["calificaciones","calificacion"]));
const V=/\b(AUTOMOVIL|VEHICULO|RODADO|CAMIONETA|CAMION|UTILITARIO|FURGON|SEDAN|COCHE|AUTO)\b/;
const S=/\b(SUSTRA(?:E|EN|JO|JERON|IDO|IDA)|ROBA(?:N|RON|DO|DA)?|APODERA(?:N|RON)?|SE LLEV(?:A|AN|ARON)|NO SE ENCONTRABA|YA NO (?:SE )?ENCONTRABA)\b/;
const R=/\b(HALLA(?:DO|DA|RON|N)?|LOCALIZA(?:DO|DA|RON|N)?|RECUPERA(?:DO|DA|RON|N)?|ABANDONAD[OA]|PEDIDO DE SECUESTRO(?: ACTIVO)?)\b/;
const M=/\b(MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR)\b/;
function near(t,a,b,d=150){for(const m of t.matchAll(new RegExp(a.source,"g"))){if(b.test(t.slice(Math.max(0,m.index-d),m.index+d)))return true}return false}
function f1(r){const t=txt(r),c=car(r);if(!t)return null;const q=/SUSTRA[C]?CION AUTOMOTOR|HALLAZGO AUTOMOTOR/.test(c);if(!(V.test(t)||q)||!(S.test(t)||R.test(t)||q))return null;if(M.test(t)&&!V.test(t)&&!q)return null;return {...r,ETAPA_1:"CANDIDATO",MOTIVO_1:"Automotor + evento compatible. Pasa a auditoría estricta."}}
function f2(r){
 const t=txt(r), c=car(r), cf=calif(r);
 const autoWord=/\b(AUTOMOVIL|AUTO|CAMIONETA|CAMION|UTILITARIO|FURGON|SEDAN|COCHE)\b/.test(t);
 const genericVehicle=/\b(VEHICULO|RODADO)\b/.test(t);
 const moto=M.test(t);
 const quironAuto=/AUTOMOTOR/.test(c);
 const wholeAuto=autoWord || (genericVehicle&&!moto) || quironAuto;
 if(!wholeAuto)return {ok:0,why:"No hay evidencia suficiente de que el objeto principal sea un automotor completo."};

 const motoAsObject=/(?:SUSTRA(?:E|EN|JO|JERON)|ROBA(?:N|RON)?|HALLA(?:N|RON)?|RECUPERA(?:N|RON)?|LOCALIZA(?:N|RON)?)[^.!?]{0,140}\b(?:MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR)\b/.test(t)
   ||/\b(?:MOTO|MOTOCICLETA|MOTOVEHICULO|CICLOMOTOR)\b[^.!?]{0,140}(?:SUSTRAID[OA]|ROBADA|HALLAD[OA]|RECUPERAD[OA]|LOCALIZAD[OA])\b/.test(t);
 const motoAsMeans=/\b(?:A BORDO DE|EN|MEDIANTE|UTILIZANDO) (?:UN |UNA )?(?:MOTO|MOTOCICLETA|MOTOVEHICULO)\b/.test(t)
   ||/\b(?:AUTORES?|SUJETOS?|MASCULINOS?)\b.{0,160}\b(?:MOTO|MOTOCICLETA|MOTOVEHICULO)\b/.test(t);
 if(motoAsObject && !autoWord && !quironAuto)
   return {ok:0,why:"El objeto sustraído/hallado es un motovehículo; queda fuera del auditor de automotores."};

 const procedure=/\b(ACTA DE PROCEDI|ACTA DE PROCEDIMIENTO|RECORRIDA|COMANDO DE PATRULLAS|MOVIL POLICIAL|SOMOS COMISIONADOS|ALERTADOS POR 911|OPERADOR DE RADIO|CURSAR (?:POR )?SISTEMA)\b/.test(t);
 const victimComplaint=/\b(DENUNCIA|DENUNCIANTE|RESULTA SER (?:TITULAR|POSEEDOR)|DEJA ESTACIONADO|DEJO ESTACIONADO|CONSTATA)\b/.test(t);

 const theftStrong=near(t,V,S,300)||near(t,S,V,300)
   ||/\b(SE LO|SE LA|LO|LA) (?:HABRIAN |HABRIA )?(?:SUSTRAIDO|ROBADO|LLEVADO)\b/.test(t)
   ||/\b(?:TOMAN|TOMARON|SUSTRAEN|SUSTRAJERON) (?:LA |LAS )?LLAVE(?:S)?\b.{0,260}\b(?:SE DAN|DANDOSE|DARSE) A LA FUGA\b/.test(t)
   ||/\b(?:SUBEN|SUBIERON|ABORDAN|ABORDARON) (?:A |AL )?(?:SU |EL )?(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,220}\b(?:FUGA|RETIRAN|HUYEN)\b/.test(t)
   ||/\b(?:DEJO|DEJA|HABIA DEJADO) (?:ESTACIONADO )?(?:SU |EL )?(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,450}\b(?:NO SE ENCONTRABA|YA NO ESTABA|CONSTATA.{0,100}(?:FALTANTE|SUSTRA))\b/.test(t)
   ||/\b(?:DESPOJA|DESPOJAN|DESPOJARON|DESPOJARLO|DESPOJARLA)\b.{0,160}\b(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b/.test(t)
   ||/\b(?:LE|LO|LA) SUSTRA(?:EN|JERON|JO|E)\b.{0,180}\b(?:SU |EL |LA )?(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b/.test(t)
   ||/\b(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,180}\b(?:LE|LO|LA) (?:SUSTRAEN|SUSTRAJERON|ROB[A-Z]*|LLEVAN|LLEVARON)\b/.test(t)
   ||/\bCONSTATA\b.{0,140}\b(?:QUE )?(?:SU |EL |LA )?(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b.{0,80}\b(?:NO ESTABA|NO SE ENCONTRABA|HABIA DESAPARECIDO)\b/.test(t)
   ||/\b(?:OBLIGA|OBLIGAN|INTIMA|INTIMAN)\b.{0,180}\bDESCEND(?:ER|ER DEL|A|E)\b.{0,260}\b(?:SE RETIRA|SE RETIRAN|HUYE|HUYEN|FUGA)\b.{0,180}\b(?:UNIDAD|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA)\b/.test(t);

 const recoveryAction=/\b(?:HALLA|HALLAN|HALLADO|HALLADA|LOCALIZA|LOCALIZAN|LOCALIZADO|LOCALIZADA|RECUPERA|RECUPERAN|RECUPERADO|RECUPERADA|ENCONTRADO|ENCONTRADA|HABIDO|HABIDA)\b/;
 const recoveryStrong=
   /\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b.{0,220}\b(?:FUE|ES|RESULTA|SIENDO)? ?(?:HALLADO|HALLADA|LOCALIZADO|LOCALIZADA|RECUPERADO|RECUPERADA|ENCONTRADO|ENCONTRADA|HABIDO|HABIDA)\b/.test(t)
   ||/\b(?:HALLAN|HALLA|LOCALIZAN|LOCALIZA|RECUPERAN|RECUPERA|ENCONTRARON|HALLADO|LOCALIZADO|RECUPERADO)\b.{0,220}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b/.test(t)
   ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b.{0,180}\bABANDONAD[OA]\b/.test(t)
   ||/\bABANDONAD[OA]\b.{0,180}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b/.test(t);
 const seizureStatus=/\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO(?: ACTIVO)?\b/.test(t);
 const existingSeizure=/\b(?:POSEE|REGISTRA|SURGE|PESA|TENIA|TENÍA|CON|RESULTA (?:QUE )?(?:POSEE|REGISTRA)|ARROJA)\b.{0,120}\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO(?: ACTIVO)?\b/.test(t)
   ||/\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO(?: ACTIVO)?\b.{0,140}\b(?:VIGENTE|ACTIVO|FECHA|SOLICITADO|REQUERIDO)\b/.test(t);
 const newSeizure=/\b(?:SE DISPONE|DISPONE|SE SOLICITA|SOLICITA|SE IMPARTE|IMPARTE|SE CURSA|CURSA|SE INSERTA|INSERTA)\b.{0,120}\bPEDIDO (?:DE |DE ADELANTO DE )?SECUESTRO\b/.test(t);
 const policePossession=/\b(?:INTERCEPTA|INTERCEPTADO|IDENTIFICA|IDENTIFICADO|PROCEDE AL SECUESTRO|SECUESTRA|INCAUTA|INCAUTADO|HALLA|HALLADO|LOCALIZA|LOCALIZADO|ENCUENTRA|ENCONTRADO)\b.{0,260}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|DOMINIO|CHASIS|MOTOR)\b/.test(t)
   ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION)\b.{0,260}\b(?:INTERCEPTA|INTERCEPTADO|PROCEDE AL SECUESTRO|SECUESTRA|INCAUTA|HALLA|HALLADO|LOCALIZA|LOCALIZADO|ENCUENTRA|ENCONTRADO)\b/.test(t);
 const immediateRecovery=
   /\b(?:AL MOMENTO DE (?:REALIZAR|RADICAR) LA DENUNCIA|MIENTRAS SE ENCONTRABA (?:REALIZANDO|RADICANDO).{0,60}DENUNCIA).{0,220}\b(?:FUE HABID[OA]|HABIA SIDO HABID[OA]|HABRIA SIDO HALLAD[OA]|HABIA SIDO HALLAD[OA]|HABIA APARECIDO)\b/.test(t)
   ||/\b(?:VEHICULO|RODADO|AUTO|CAMIONETA|UNIDAD).{0,80}\b(?:HABIA APARECIDO|HABRIA SIDO HALLAD[OA]|HABIA SIDO LOCALIZAD[OA]|FUE HABID[OA])\b/.test(t)
   ||/\b(?:TOMA CONOCIMIENTO|INFORMAN|AVISAN).{0,180}\b(?:UNIDAD|VEHICULO|RODADO|AUTO|CAMIONETA).{0,100}\b(?:HABIA SIDO LOCALIZAD[OA]|HABIA SIDO HALLAD[OA]|HABIA APARECIDO|FUE HABID[OA])\b/.test(t)
   ||/\b(?:PROCEDE|PROCEDEN).{0,100}\bHALLAZGO DE (?:SU|LA|EL) (?:UNIDAD|VEHICULO|RODADO|AUTO|CAMIONETA)\b/.test(t)
   ||/\b(?:DAN|DIO|DA) CON (?:LA|EL) (?:CAMIONETA|VEHICULO|RODADO|AUTO)\b/.test(t)
   ||/\b(?:LE|LO|LA|LOS) (?:SUSTRAEN|SUSTRAJERON).{0,300}\b(?:DEJANDOLO|DEJANDOLA|LO DEJARON|LA DEJARON).{0,80}\bABANDONAD[OA]\b/.test(t)
   ||/\bGEOLOCALIZACION\b.{0,500}\b(?:CONSTATAR|CONSTATAN|CONSTATANDO).{0,100}\bSE HALLABA (?:EL |LA )?(?:VEHICULO|RODADO|AUTO|CAMIONETA|UNIDAD)\b/.test(t)
   ||/\bRASTREO\b.{0,500}\b(?:UNIDAD|VEHICULO|RODADO|AUTO|CAMIONETA).{0,100}\bHABIA SIDO LOCALIZAD[OA]\b/.test(t)
   ||/\bLOGRARON HALLAR (?:SU |EL |LA )?(?:VEHICULO|RODADO|AUTO|CAMIONETA|UNIDAD)\b/.test(t)
   ||/\bAPLICACION DEL RASTREO\b.{0,350}\bCONSTATA QUE (?:EL |LA )?(?:RODADO|VEHICULO|AUTO|CAMIONETA|UNIDAD) SE ENCONTRABA\b/.test(t)
   ||/\b(?:EMPRESA|DISPOSITIVO).{0,200}\bDAN AVISO QUE (?:EL |LA )?(?:RODADO|VEHICULO|AUTO|CAMIONETA|UNIDAD) SE ENCONTRABA REPORTANDO\b/.test(t)
   ||/\bSUSTRACCION DEL (?:RODADO|VEHICULO).{0,180}\b(?:LO|LA) ENCUENTRA ABANDON/.test(t)
   ||/\bMOMENTOS ANTES.{0,300}\bSUSTRAID[OA].{0,3000}\bQUE VENIAN SIGUIENDO\b/.test(t)
   ||/\bFUE RECIENTEMENTE SUSTRAID[OA]\b/.test(t)
   ||/\bDESPOJARLO DE LA MISMA\b.{0,2500}\bVEHICULOS INCAUTADOS\b/.test(t)
   ||/\bSUSTRAID[OA].{0,2500}\b(?:PROCEDEMOS|PROCEDEN) A LA INCAUTACION DEL (?:AUTOMOTOR|RODADO|VEHICULO)\b/.test(t);
 const currentFinding=(recoveryStrong || (procedure&&existingSeizure&&policePossession)) && /\b(VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|DOMINIO|CHASIS|MOTOR)\b/.test(t);

 // Motor de evidencias temporales: una tecnología o palabra aislada nunca define INMEDIATO.
 const evDuranteDenuncia=/\b(?:MIENTRAS|AL MOMENTO|EN MOMENTOS QUE).{0,100}\b(?:RADICABA|REALIZABA|FORMULABA|EFECTUABA).{0,80}\bDENUNCIA\b.{0,260}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA]|APARECIDO)\b/.test(t);
 const rastreoNegado=/\b(?:NO POSEE|NO TIENE|NO CUENTA CON|CARECE DE|DESCONOCE SI POSEE|SE ENCONTRABA INACTIVO)\b.{0,70}\b(?:LOJACK|GPS|GEOLOCALIZACION|RASTREO SATELITAL|UBICACION SATELITAL)\b/.test(t)
   ||/\b(?:LOJACK|GPS|GEOLOCALIZACION|RASTREO SATELITAL)\b.{0,70}\b(?:NO|INACTIVO|NEGATIVO)\b/.test(t);
 const trackingOtherObject=/\b(?:ICLOUD|FIND MY|GPS|GEOLOCALIZACION|UBICACION)\b.{0,220}\b(?:CELULAR|TELEFONO|IPHONE|TABLET|NOTEBOOK|COMPUTADORA|MOCHILA|BOLSO)\b/.test(t)
   ||/\b(?:CELULAR|TELEFONO|IPHONE|TABLET|NOTEBOOK|COMPUTADORA|MOCHILA|BOLSO)\b.{0,220}\b(?:ICLOUD|GPS|GEOLOCALIZACION|UBICACION)\b/.test(t);
 const evRastreoPositivo=!rastreoNegado && !trackingOtherObject && (
   /\b(?:LOJACK|GPS|GEOLOCALIZACION|RASTREO SATELITAL|UBICACION SATELITAL|STRIX|WISETRACK)\b.{0,260}\b(?:INFORMA|INFORMAN|INFORMO|INDICA|INDICAN|APORTA|APORTAN|ARROJA|ARROJAN|UBICA|UBICAN|LOCALIZA|LOCALIZAN)\b.{0,180}\b(?:UBICACION|CALLE|ARTERIA|DOMICILIO|LUGAR|VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t)
   ||/\b(?:A TRAVES DE|MEDIANTE|POR MEDIO DE)\b.{0,80}\b(?:APLICACION|LOJACK|GPS|GEOLOCALIZACION|RASTREO|STRIX|WISETRACK)\b.{0,320}\b(?:UBICA|UBICAN|LOCALIZA|LOCALIZAN|CONSTATA|CONSTATAN|ENCUENTRA|ENCUENTRAN)\b.{0,140}\b(?:RODADO|VEHICULO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t)
 );
 const evAbandonoPosterior=/\b(?:SUSTRAEN|SUSTRAJERON|ROBAN|ROBARON|APODERAN|APODERARON|SE LLEVAN|SE LLEVARON|DESPOJAN|DESPOJARON)\b.{0,900}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,220}\b(?:LO |LA )?(?:DEJAN|DEJARON|ABANDONAN|ABANDONARON|QUEDA|QUEDO|FUE)\b.{0,80}\bABANDONAD[OA]?\b/.test(t)
   ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,100}\b(?:FUE|ES|SE ENCONTRABA|SE HALLABA|QUEDO)\b.{0,50}\bABANDONAD[OA]\b/.test(t)
   ||/\b(?:LO|LA) (?:DEJAN|DEJARON|ABANDONAN|ABANDONARON)\b.{0,80}\b(?:A POCOS METROS|A POCAS CUADRAS|MINUTOS DESPUES)\b/.test(t)
   ||/\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,180}\b(?:LO|LA)? ?(?:DEJAN|DEJARON|ABANDONAN|ABANDONARON)\b.{0,100}\b(?:A POCOS METROS|A POCAS CUADRAS|EN EL LUGAR|EN VIA PUBLICA)\b/.test(t);
 const evRecuperacionExplicita=/\b(?:POSTERIORMENTE|LUEGO|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A LOS POCOS MINUTOS|A LOS? [0-9]{1,3} MINUTOS)\b.{0,420}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,160}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA]|ENCONTRAD[OA])\b/.test(t)
   ||/\b(?:POSTERIORMENTE|LUEGO|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A LOS POCOS MINUTOS|A LOS? [0-9]{1,3} MINUTOS)\b.{0,420}\b(?:HALLAN|HALLARON|HABEN|LOCALIZAN|LOCALIZARON|RECUPERAN|RECUPERARON|ENCUENTRAN|ENCONTRARON)\b.{0,120}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);
 const evMismoRodado=/\b(?:DICHO|MISMO|MENCIONADO|REFERIDO) (?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t)
   ||/\b(?:SU|EL) (?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);
 const historicalTheft=/\b(?:HABIA SIDO|HABRIA SIDO|REGISTRABA|POSEIA|POSEE|TENIA)\b.{0,120}\b(?:SUSTRAID[OA]|ROBADO|PEDIDO DE SECUESTRO)\b/.test(t);
 const impersonalHabido=/\b(?:HA|HABIA|HABRIA|HUBO) HABIDO\b.{0,60}\b(?:ILICITO|HECHO|ROBO|DELITO|INCIDENTE)\b/.test(t);
 const evAvisoHallado=!impersonalHabido && (
   /\b(?:RECIBE|RECIBIO|TOMA CONOCIMIENTO|TOMAN CONOCIMIENTO|LE INFORMAN|LE INFORMARON|SON INFORMADOS|INFORMAN|INFORMARON|LE AVISAN|LE AVISARON|ESCUCHA)\b.{0,300}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,160}\b(?:HABIA APARECIDO|HABIA SIDO HALLAD[OA]|FUE HALLAD[OA]|FUE HABID[OA]|HABIA SIDO HABID[OA]|FUE LOCALIZAD[OA]|HABIA SIDO LOCALIZAD[OA]|FUE RECUPERAD[OA]|HABIA SIDO RECUPERAD[OA])\b/.test(t)
   ||/\b(?:RECIBE|RECIBIO|TOMA CONOCIMIENTO|TOMAN CONOCIMIENTO|LE INFORMAN|LE INFORMARON|SON INFORMADOS|INFORMAN|INFORMARON|LE AVISAN|LE AVISARON)\b.{0,260}\b(?:FUE|HABIA SIDO) (?:HABID[OA]|HALLAD[OA]|LOCALIZAD[OA]|RECUPERAD[OA])\b.{0,100}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t)
   ||/\b(?:RADICANDO|FORMULANDO|EFECTUANDO|RECEPCIONANDO)\b.{0,120}\bDENUNCIA\b.{0,380}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,120}\b(?:HABID[OA]|HALLAD[OA]|LOCALIZAD[OA]|RECUPERAD[OA])\b/.test(t)
   ||/\b(?:AVISO|COMUNICACION|MODULACION|RADIAL|911)\b.{0,260}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,120}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA])\b/.test(t)
 );
 const evDanCon=/\b(?:DAN|DIERON|LOGRAN|LOGRARON) (?:FINALMENTE )?CON (?:EL |LA |DICHO |DICHA |SU )?(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);
 const evConstataRecuperado=/\b(?:SE DIRIGE|SE DIRIGIO|ARRIBA|ARRIBO|CONCURRE|CONCURRIO)\b.{0,220}\b(?:AL LUGAR|A LA UBICACION|A DICHA UBICACION)\b.{0,180}\b(?:CONSTATA|CONSTATANDO|OBSERVA|VISUALIZA|RECONOCE)\b.{0,100}\b(?:LA PRESENCIA DE )?(?:EL |SU |DICHO )?(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t)
   ||/\bCONSTATA\b.{0,80}\bLA PRESENCIA (?:DEL|DE SU|DE DICHO) (?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);
 const evHallazgoDuranteDenuncia=/\b(?:AL MOMENTO|MIENTRAS|EN MOMENTOS)\b.{0,180}\b(?:DENUNCIA|DENUNCIANDO|RECEPCIONANDO|RADICANDO)\b.{0,220}\b(?:TOMA CONOCIMIENTO|INFORMAN|INFORMARON)\b.{0,180}\b(?:HALLAD[OA]|LOCALIZAD[OA]|RECUPERAD[OA])\b/.test(t);
 // V9.7: las negaciones y el orden temporal tienen prioridad sobre coincidencias léxicas.
 const negativeAbsence=/\b(?:CONSTATA|ADVIERTE|OBSERVA)\b.{0,120}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,100}\b(?:NO SE ENCONTRABA|NO ESTABA|YA NO SE ENCONTRABA|NO SE HALLABA|FALTABA)\b/.test(t)

 const positiveConstata=evConstataRecuperado && !negativeAbsence;
 const immediateEvidence=[evDuranteDenuncia,evRastreoPositivo,evAbandonoPosterior,evRecuperacionExplicita,evAvisoHallado,evDanCon,positiveConstata,evHallazgoDuranteDenuncia].filter(Boolean).length;

 // Una recuperación histórica no puede cerrar como INMEDIATO una nueva sustracción.
 // También evitamos que "constata que el vehículo NO estaba" sea leído como hallazgo.
 const historicalRecoveryBeforeCurrent=/\b(?:DIA|FECHA)\b.{0,80}\b(?:ANTERIOR|PASAD[OA]|[0-3]?[0-9][\/\-][01]?[0-9][\/\-](?:20)?2[0-9])\b.{0,500}\b(?:RECUPER[AO]|HALLAD[OA]|HABID[OA])\b.{0,800}\b(?:EN LA FECHA|DIA DE LA FECHA|HOY)\b.{0,500}\b(?:SUSTRA|ROBA|APODERA)\w*/.test(t);
 const accessoryOnly=/\b(?:SUSTRAJERON|SUSTRAJO|SUSTRAE|SUSTRAEN|ROBARON|ROBO|ROBA|ROBAN|APODERARON|APODERO)\b.{0,160}\b(?:RUEDA|CUBIERTA|NEUMATICO|AUXILIO|BATERIA|ESTEREO|PATENTE|CHAPA PATENTE|PERTENENCIAS|MORRAL|BOLSO|MOCHILA|HERRAMIENTAS|CELULAR|TELEFONO|IPHONE)\b/.test(t)
   && !/\b(?:SUSTRAJERON|SUSTRAE|SUSTRAEN|ROBARON|ROBA|ROBAN|SE LLEVAN|SE LLEVARON)\b.{0,120}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD)\b/.test(t);
 const immediateHigh=theftStrong && !accessoryOnly && immediateEvidence>0
   && (evMismoRodado||evAvisoHallado||evDanCon||positiveConstata||evHallazgoDuranteDenuncia||evAbandonoPosterior||evRastreoPositivo)
   && !negativeAbsence && !historicalRecoveryBeforeCurrent
   && !(historicalTheft && !victimComplaint && !evAbandonoPosterior);

 const procedureStartsWithVehicle=/\b(?:SOMOS COMISIONADOS|COMISIONADOS|ALERTADOS POR 911|RECIBEN MODULACION|MODULACION RADIAL|SE CONSTITUYEN|ARRIBAN|CONCURREN)\b.{0,420}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,180}\b(?:ABANDONAD[OA]|LOCALIZAD[OA]|HALLAD[OA]|ESTACIONAD[OA]|INTERCEPTAD[OA])\b/.test(t)
   ||/\b(?:EMPRESA|LOJACK|STRIX|WISETRACK|911)\b.{0,260}\b(?:INFORMA|INFORMO|REPORTA|REPORTO|MODULA)\b.{0,180}\b(?:UBICACION|LOCALIZACION)\b.{0,180}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);
 const currentTheftComplaintFirst=victimComplaint && theftStrong && !procedureStartsWithVehicle;

 const abandonedPriorTheft=/\b(?:COMISIONADOS|COMISIONADO|ALERTADOS|CONCURREN|ARRIBAN|RECORRIDA)\b.{0,420}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b.{0,180}\bABANDONAD[OA]\b/.test(t)
   && /\b(?:PEDIDO DE SECUESTRO|SUSTRAID[OA]|ROBADO)\b/.test(t)
   && !victimComplaint;

 const rawHallazgo=/\bHALLAZGO DE AUTOMOTOR\b/.test(cf);
 const hallazgoProcedure=rawHallazgo && procedure && (policePossession||recoveryStrong||/\b(?:ESTADO DE ABANDONO|ABANDONAD[OA]|CIRCULABA|ESTACIONADO)\b/.test(t));

 // V9.12 — motor común con validación semántica del estado de cada evento.
 // Una palabra de hallazgo/sustracción no vale por sí sola: debe describir un hecho afirmado y ligado al automotor.
 const vehicleN="(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|CAMION|UTILITARIO|UNIDAD)";
 const accessoryN="(?:RUEDA|CUBIERTA|NEUMATICO|AUXILIO|BATERIA|ESTEREO|PATENTE|CHAPA PATENTE|PERTENENCIAS|MORRAL|BOLSO|MOCHILA|HERRAMIENTAS|CELULAR|TELEFONO|IPHONE)";
 const theftVerb="(?:SUSTRAE|SUSTRAEN|SUSTRAJO|SUSTRAJERON|ROBA|ROBAN|ROBO|ROBARON|APODERA|APODERAN|APODERO|APODERARON|SE LLEVA|SE LLEVAN|SE LLEVO|SE LLEVARON)";
 const recoveryVerb="(?:HALLADO|HALLADA|HABIDO|HABIDA|LOCALIZADO|LOCALIZADA|RECUPERADO|RECUPERADA|ENCONTRADO|ENCONTRADA|HALLAN|HALLARON|LOCALIZAN|LOCALIZARON|RECUPERAN|RECUPERARON|ENCUENTRAN|ENCONTRARON)";

 const wholeTheftBound=new RegExp("\\b"+theftVerb+"\\b[^.!?]{0,180}\\b"+vehicleN+"\\b|\\b"+vehicleN+"\\b[^.!?]{0,180}\\b(?:SUSTRAID[OA]|ROBADO|ROBADA|SE LO LLEVARON|SE LA LLEVARON)\\b").test(t)
   ||/\b(?:DESPOJA|DESPOJAN|DESPOJARON)\b[^.!?]{0,180}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t)
   ||/\b(?:DEJO|DEJA|HABIA DEJADO)\b[^.!?]{0,150}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b[^.!?]{0,260}\b(?:NO ESTABA|NO SE ENCONTRABA|HABIA DESAPARECIDO|FALTANTE)\b/.test(t)
   ||/\b(?:OBLIGA|OBLIGAN|INTIMA|INTIMAN)\b[^.!?]{0,180}\bDESCEND(?:ER|A|E)\b[^.!?]{0,300}\b(?:HUYE|HUYEN|FUGA|SE RETIRA|SE RETIRAN)\b[^.!?]{0,180}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);

 const accessoryTheftBound=new RegExp("\\b"+theftVerb+"\\b[^.!?]{0,150}\\b"+accessoryN+"\\b").test(t);
 const theftOfWholeVehicle=(wholeTheftBound || (theftStrong&&!accessoryTheftBound)) && !motoAsObject;

 // Estados que invalidan una supuesta recuperación: negación, intención/búsqueda, posibilidad o pregunta.
 const recoveryNegated=/\b(?:NO|SIN)\b.{0,90}\b(?:HALLAR|HALLADO|HABIDO|LOCALIZAR|LOCALIZADO|RECUPERAR|RECUPERADO|ENCONTRAR|ENCONTRADO)\b/.test(t)
   ||/\b(?:NO FUE|NO HA SIDO|NO HABIA SIDO)\b.{0,50}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA]|ENCONTRAD[OA])\b/.test(t);
 const recoveryIntent=/\b(?:PARA|A FIN DE|CON EL FIN DE|CON INTENCION DE|TRATANDO DE|INTENTA|INTENTANDO|SALE A|SALIO A|SE DIRIGE A)\b.{0,120}\b(?:VER SI )?(?:HALLAR|ENCONTRAR|LOCALIZAR|RECUPERAR)\b/.test(t)
   ||/\b(?:BUSCA|BUSCABA|BUSCAR|RASTRILLA|RASTRILLAJE)\b.{0,120}\b(?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);
 const recoveryHypothetical=/\b(?:PODRIA|PODRIA HABER|HABRIA QUE|POSIBLEMENTE|PRESUNTAMENTE|SUPUESTAMENTE)\b.{0,100}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA]|ENCONTRAD[OA]|ENCONTRARSE)\b/.test(t)
   ||/\b(?:SI|EN CASO DE QUE)\b.{0,80}\b(?:HALLAN|HALLARAN|ENCUENTRAN|ENCONTRARAN|LOCALIZAN|RECUPERAN)\b/.test(t);
 const recoveryQuestion=/\b(?:CONSULTAD[OA]|PREGUNTAD[OA])\b.{0,100}\b(?:SI|SOBRE)\b.{0,100}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA]|ENCONTRAD[OA])\b/.test(t);

 // Recuperación positiva exige verbo afirmado y vínculo cercano con el automotor, o una de las secuencias fuertes ya aprendidas.
 const assertedRecovery=(
   new RegExp("\\b"+vehicleN+"\\b[^.!?]{0,170}\\b"+recoveryVerb+"\\b|\\b"+recoveryVerb+"\\b[^.!?]{0,170}\\b"+vehicleN+"\\b").test(t)
   ||evDuranteDenuncia||evHallazgoDuranteDenuncia||evAvisoHallado||evDanCon||positiveConstata||evRastreoPositivo||evAbandonoPosterior
 ) && !negativeAbsence && !recoveryNegated && !recoveryIntent && !recoveryHypothetical && !recoveryQuestion
   && !trackingOtherObject && !impersonalHabido;

 const currentTheftNarrative=theftOfWholeVehicle && !historicalRecoveryBeforeCurrent;
 const sameVehicleLink=evMismoRodado||evAvisoHallado||evDanCon||positiveConstata||evAbandonoPosterior||evRastreoPositivo
   ||/\b(?:DICHO|MISMO|MENCIONADO|REFERIDO|SU|EL|LA) (?:VEHICULO|RODADO|AUTO|AUTOMOVIL|CAMIONETA|UNIDAD)\b/.test(t);

 // Recuperaciones que ocurren mientras se denuncia o al finalizar la denuncia son posteriores al robo actual.
 const complaintRecovery=/\b(?:MIENTRAS|DURANTE|AL MOMENTO DE|EN MOMENTOS QUE|AL FINALIZAR|AL MOMENTO DE FINALIZAR|FINALIZADA)\b.{0,180}\b(?:DENUNCIA|DENUNCIANDO|RADICANDO|FORMULANDO|RECEPCIONANDO)\b.{0,420}\b(?:AVISO|LLAMADO|RADIAL|911|STRIX|LOJACK|WISETRACK|HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA])\b/.test(t)
   ||/\b(?:TRASLADAN|TRASLADANDO|TRASLADO|EN CAMINO|EN TRANSITO)\b.{0,220}\b(?:DEPENDENCIA|COMISARIA|DENUNCIA)\b.{0,420}\b(?:RADIAL|MODULA|INFORMAN|INFORMARON|AVISAN|AVISARON)\b.{0,220}\b(?:HALLAD[OA]|HABID[OA]|LOCALIZAD[OA]|RECUPERAD[OA]|ENCONTRAD[OA])\b/.test(t);

 const temporalRecovery=assertedRecovery && (
   complaintRecovery||evDuranteDenuncia||evHallazgoDuranteDenuncia||evAvisoHallado||evRastreoPositivo||evAbandonoPosterior||evRecuperacionExplicita
   ||/\b(?:POSTERIORMENTE|LUEGO|MINUTOS DESPUES|HORAS DESPUES|MOMENTOS DESPUES|A LOS POCOS MINUTOS)\b/.test(t)
 );

 // El hecho principal se infiere por cómo comienza la actuación, no por palabras que aparecen luego en antecedentes.
 const policeFindingOrigin=procedureStartsWithVehicle||abandonedPriorTheft||hallazgoProcedure
   ||(procedure&&existingSeizure&&policePossession);
 const hallazgoAsMainEvent=policeFindingOrigin && assertedRecovery && !complaintRecovery && !evDuranteDenuncia && !evHallazgoDuranteDenuncia;

 // OBJETO: pertenencia/autoparte como único objeto de sustracción => fuera.
 if(accessoryTheftBound && !wholeTheftBound)
   return {ok:0,why:"La sustracción afirmada recae sobre una autoparte/pertenencia; el automotor aparece sólo como contexto."};
 if(motoAsObject && !autoWord && !quironAuto)
   return {ok:0,why:"El objeto principal es un motovehículo; queda fuera del auditor de automotores."};

 // HALLAZGO: la actuación actual nace del vehículo ya localizado/interceptado/abandonado.
 if(hallazgoAsMainEvent)
   return {ok:1,cond:"HALLAZGO",why:"El hecho actual nace del hallazgo/localización/interceptación del automotor; la sustracción o pedido funciona como antecedente."};

 // INMEDIATO: dos eventos afirmados y relacionados, nunca una búsqueda, hipótesis o negación.
 if(currentTheftNarrative && assertedRecovery && temporalRecovery && sameVehicleLink)
   return {ok:1,cond:"INMEDIATO",why:"Sustracción actual afirmada + recuperación posterior afirmada del mismo automotor dentro de la misma secuencia."};

 // SUSTRAÍDO: robo actual afirmado sin recuperación positiva válida.
 if(currentTheftNarrative && !assertedRecovery)
   return {ok:1,cond:"SUSTRAIDO",why:newSeizure?"Sustracción actual afirmada; el pedido de secuestro se genera por este hecho y no es recuperación.":"Sustracción actual afirmada del automotor completo, sin recuperación posterior acreditada."};

 // Recuperación actual con robo/pedido previo.
 if(assertedRecovery && (historicalTheft||existingSeizure) && !currentTheftNarrative)
   return {ok:1,cond:"HALLAZGO",why:"Recuperación actual afirmada del automotor con sustracción/pedido previo como antecedente."};

 // Sólo los conflictos semánticos reales llegan a revisión.
 if(currentTheftNarrative && assertedRecovery)
   return {ok:1,cond:"REVISION HUMANA",why:"Sustracción y recuperación están afirmadas, pero no puede acreditarse con seguridad su orden o pertenencia a la misma secuencia."};

 if(currentTheftNarrative)
   return {ok:1,cond:"SUSTRAIDO",why:"Sustracción actual afirmada del automotor completo sin recuperación posterior acreditada."};

 if(assertedRecovery && (procedure||rawHallazgo||existingSeizure))
   return {ok:1,cond:"HALLAZGO",why:"Predomina un evento actual afirmado de hallazgo/localización del automotor."};

 if(quironAuto && (theftStrong||recoveryStrong))
   return {ok:1,cond:"REVISION HUMANA",why:"Automotor relevante, pero el estado del evento (actual/antecedente/afirmado) no permite clasificarlo con seguridad."};

 return {ok:0,why:"Sin evidencia narrativa suficiente de sustracción, hallazgo o recuperación del automotor completo."};
}
function extract(r){const t=txt(r),pick=arr=>{for(const re of arr){const m=t.match(re);if(m)return m[1].trim()}return ""};return {...r,PATENTE:pick([/\bDOMINIO\s*(?:NRO|N°|NUMERO)?\s*[:\-]?\s*([A-Z]{2,3}\s?\d{3}\s?[A-Z]{0,2}|[A-Z]{3}\s?\d{3})\b/]),MOTOR:pick([/\b(?:NUMERO DE MOTOR|MOTOR(?: NRO| N°| NUMERO)?)\s*[:\-]?\s*([A-Z0-9.-]{4,25})\b/]),CHASIS:pick([/\b(?:NUMERO DE CHASIS|CHASIS(?: NRO| N°| NUMERO)?)\s*[:\-]?\s*([A-Z0-9.-]{6,30})\b/])}}
function tick(){return new Promise(r=>setTimeout(r,0))}
function show(rows,key,msg){status.textContent=msg;const c={};rows.forEach(r=>c[r[key]]=(c[r[key]]||0)+1);$("summary").innerHTML=Object.entries(c).map(([k,v])=>'<div class="pill">'+k+": "+v+"</div>").join("");$("rows").innerHTML=rows.slice(0,500).map(r=>"<tr><td>"+esc(r[key])+"</td><td>"+esc(get(r,["numero_interno","nro_interno","numero interno"]))+"</td><td>"+esc(get(r,["analisis_caratula","caratula"]))+"</td><td>"+esc(r.MOTIVO_2||r.MOTIVO_1||"")+"</td><td class='relato'>"+esc(get(r,["relato","descripcion","narrativa","hecho"]))+"</td></tr>").join("")}
function esc(v){return (v??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function dl(name,sheets){const wb=XLSX.utils.book_new();sheets.forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));XLSX.writeFile(wb,name)}
status.textContent="✅ Aplicación lista. Seleccioná el Excel de Cassandra.";
$("file").addEventListener("change",async function(){const f=this.files[0];if(!f)return;try{status.textContent="Leyendo "+f.name+"…";const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});src=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});cand=[];accepted=[];rejected=[];finalRows=[];$("f1").disabled=!src.length;$("f2").disabled=$("f3").disabled=true;["d1","d2","d3"].forEach(x=>$(x).disabled=true);status.textContent="✅ "+src.length.toLocaleString("es-AR")+" denuncias cargadas. Presioná 1️⃣ Detectar candidatos."}catch(e){status.textContent="❌ "+e.message}});
$("f1").addEventListener("click",async()=>{cand=[];$("f1").disabled=true;for(let i=0;i<src.length;i++){const x=f1(src[i]);if(x)cand.push(x);if(i%250===0){status.textContent="🔎 Filtro 1 procesando… "+Math.round(100*i/src.length)+"%";await tick()}}$("f1").disabled=false;$("f2").disabled=!cand.length;$("d1").disabled=!cand.length;show(cand,"ETAPA_1","✅ Filtro 1 terminado: "+cand.length.toLocaleString("es-AR")+" candidatos de "+src.length.toLocaleString("es-AR")+".")});
$("f2").addEventListener("click",async()=>{accepted=[];rejected=[];$("f2").disabled=true;for(let i=0;i<cand.length;i++){const r=cand[i],x=f2(r),z={...r,CONDICION_AUDITOR:x.cond||"DESCARTADO",MOTIVO_2:x.why};(x.ok?accepted:rejected).push(z);if(i%150===0){status.textContent="🧠 Filtro 2 procesando… "+Math.round(100*i/cand.length)+"%";await tick()}}$("f2").disabled=false;$("f3").disabled=!accepted.length;$("d2").disabled=false;show(accepted,"CONDICION_AUDITOR","✅ Filtro 2: "+accepted.length.toLocaleString("es-AR")+" aceptados / "+rejected.length.toLocaleString("es-AR")+" descartados.")});
$("f3").addEventListener("click",async()=>{status.textContent="🧾 Filtro 3 completando datos…";await tick();finalRows=accepted.map(extract);$("d3").disabled=!finalRows.length;show(finalRows,"CONDICION_AUDITOR","✅ Filtro 3 terminado: "+finalRows.length.toLocaleString("es-AR")+" casos finales.")});
$("d1").onclick=()=>dl("FILTRO_1_CANDIDATOS.xlsx",[["CANDIDATOS",cand]]);
$("d2").onclick=()=>dl("FILTRO_2_AUDITORIA.xlsx",[["ACEPTADOS",accepted],["DESCARTADOS",rejected]]);
$("d3").onclick=()=>dl("AUDITORIA_AUTOMOTORES_FINAL.xlsx",[["FINAL",finalRows]]);
})();
</script></body></html>
