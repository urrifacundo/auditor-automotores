<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auditor de Automotores</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<main>
<h1>Auditor de Automotores</h1>
<p class="lead">Primera etapa: detectar automotores sustraídos, inmediatos y hallazgos leyendo el relato.</p>
<section class="card">
<input id="file" type="file" accept=".xlsx,.xls">
<button id="audit" disabled>🔎 Auditar vehículos</button>
<button id="download" disabled>⬇ Descargar resultado</button>
<div id="status">Cargá un Excel de Cassandra.</div>
</section>
<section id="summary" class="summary"></section>
<section class="card">
<table><thead><tr><th>Condición</th><th>N° interno</th><th>Carátula Quirón</th><th>Motivo</th><th>Relato</th></tr></thead>
<tbody id="rows"></tbody></table>
</section>
</main>
<script src="app.js"></script>
</body></html>
